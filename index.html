<!DOCTYPE html>
<html lang="fa" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Yakarim Call Piti</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23090b16'/%3E%3Ccircle cx='32' cy='32' r='22' fill='none' stroke='%234f7cff' stroke-width='2'/%3E%3Ccircle cx='32' cy='32' r='13' fill='none' stroke='%23a855f7' stroke-width='2'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%2322d3ee'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --void:#05060f; --surface-0:#0a0c18; --surface-1:#0e1120;
  --glass-fill:rgba(255,255,255,.045); --glass-fill-strong:rgba(255,255,255,.08);
  --glass-border:rgba(255,255,255,.09); --glass-border-strong:rgba(255,255,255,.16);
  --blue:#4f7cff; --purple:#a855f7; --cyan:#22d3ee; --green:#34d399; --red:#fb5568; --amber:#fbbf24;
  --text-0:#f3f5ff; --text-1:#c7cbe6; --text-2:#8b90b3; --text-3:#5c6187;
  --grad-primary:linear-gradient(135deg,var(--blue),var(--purple));
  --grad-text:linear-gradient(90deg,#7aa4ff,#c084fc 55%,#67e8f9);
  --radius-lg:22px; --radius-pill:999px;
  --ease-spring:cubic-bezier(.34,1.56,.64,1); --ease-out:cubic-bezier(.16,1,.3,1);
  --font-display:'Space Grotesk',system-ui,sans-serif; --font-body:'Inter',system-ui,sans-serif; --font-mono:'JetBrains Mono',monospace;
}
*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
html,body{ height:100%; }
body{
  background:var(--void); color:var(--text-0); font-family:var(--font-body);
  overflow:hidden; -webkit-font-smoothing:antialiased;
}
button{ font-family:inherit; cursor:pointer; background:none; border:none; color:inherit; }
input{ font-family:inherit; color:inherit; }
::selection{ background:rgba(79,124,255,.35); }
::-webkit-scrollbar{ width:7px; } ::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.14); border-radius:10px; }

/* ambient bg */
.ambient-bg{ position:fixed; inset:0; z-index:-1; overflow:hidden; }
.glow{ position:absolute; border-radius:50%; filter:blur(90px); opacity:.35; }
.glow-a{ width:560px; height:560px; background:var(--blue); top:-180px; left:-140px; animation:driftA 20s ease-in-out infinite alternate; }
.glow-b{ width:480px; height:480px; background:var(--purple); bottom:-160px; right:-120px; animation:driftB 24s ease-in-out infinite alternate; }
@keyframes driftA{ from{transform:translate(0,0)} to{transform:translate(70px,50px) scale(1.1)} }
@keyframes driftB{ from{transform:translate(0,0)} to{transform:translate(-50px,-40px) scale(1.05)} }
.grid-overlay{ position:absolute; inset:0; background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px); background-size:52px 52px; mask-image:radial-gradient(ellipse at 50% 10%, black, transparent 72%); }

.glass{
  background:var(--glass-fill); backdrop-filter:blur(22px) saturate(140%); -webkit-backdrop-filter:blur(22px) saturate(140%);
  border:1px solid var(--glass-border); border-radius:var(--radius-lg); box-shadow:0 20px 60px -20px rgba(0,0,0,.6);
  position:relative;
}
.brand{ display:inline-flex; align-items:center; gap:10px; }
.brand-mark{ width:30px; height:30px; flex-shrink:0; }
.brand-mark .ring{ fill:none; stroke-width:2.4; }
.brand-mark .r1{ stroke:var(--blue); opacity:.85; } .brand-mark .r2{ stroke:var(--purple); opacity:.9; }
.brand-mark .core{ fill:var(--cyan); filter:drop-shadow(0 0 6px var(--cyan)); }
.brand-word{ font-family:var(--font-display); font-weight:700; font-size:16px; }
.brand-word span{ background:var(--grad-text); -webkit-background-clip:text; background-clip:text; color:transparent; }

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:12px 20px; border-radius:var(--radius-pill);
  font-family:var(--font-display); font-weight:600; font-size:14px; transition:transform .18s var(--ease-spring), box-shadow .3s, background .2s;
}
.btn:active{ transform:scale(.96); }
.btn-primary{ background:var(--grad-primary); color:#fff; box-shadow:0 8px 34px -8px rgba(79,124,255,.5); }
.btn-primary:hover{ box-shadow:0 10px 42px -6px rgba(79,124,255,.65); transform:translateY(-2px); }
.btn-glass{ background:var(--glass-fill-strong); border:1px solid var(--glass-border-strong); }
.btn-glass:hover{ background:rgba(255,255,255,.13); }
.btn-full{ width:100%; }
.btn[disabled]{ opacity:.5; pointer-events:none; }

/* ---------- JOIN SCREEN ---------- */
#screen-join{ height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
.join-card{ width:min(430px,100%); padding:36px 30px; }
.join-card .brand{ margin-bottom:26px; }
.join-card h1{ font-family:var(--font-display); font-size:23px; margin-bottom:6px; }
.join-card p.sub{ color:var(--text-2); font-size:13.5px; margin-bottom:24px; line-height:1.55; }
.field{ display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
.field span{ font-size:12px; color:var(--text-2); font-weight:500; }
.field input{
  padding:12px 14px; border-radius:12px; background:rgba(255,255,255,.035); border:1px solid var(--glass-border);
  font-size:14px; outline:none; transition:border-color .2s, background .2s;
}
.field input:focus{ border-color:var(--blue); background:rgba(255,255,255,.05); }
.room-row{ display:flex; gap:8px; }
.room-row input{ flex:1; font-family:var(--font-mono); letter-spacing:1px; }
.preview-box{
  position:relative; width:100%; aspect-ratio:16/10; border-radius:16px; overflow:hidden; background:#090c18;
  border:1px solid var(--glass-border); margin-bottom:16px; display:flex; align-items:center; justify-content:center;
}
.preview-box video{ width:100%; height:100%; object-fit:cover; transform:scaleX(-1); }
.preview-avatar{ width:64px; height:64px; border-radius:50%; display:grid; place-items:center; font-weight:700; font-size:20px; background:linear-gradient(135deg,var(--blue),var(--purple)); color:#fff; font-family:var(--font-display); }
.preview-controls{ position:absolute; bottom:10px; left:50%; transform:translateX(-50%); display:flex; gap:8px; }
.mini-tool{ width:38px; height:38px; border-radius:50%; display:grid; place-items:center; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.15); color:#fff; transition:background .2s, transform .2s var(--ease-spring); }
.mini-tool:hover{ transform:translateY(-2px); }
.mini-tool.off{ background:rgba(251,85,104,.85); }
.join-status{ font-family:var(--font-mono); font-size:11.5px; color:var(--text-3); text-align:center; margin-top:14px; min-height:16px; }
.join-status.warn{ color:var(--amber); }
.join-status.err{ color:var(--red); }
.join-status.ok{ color:var(--green); }
.tips{ margin-top:18px; font-size:11.5px; color:var(--text-3); line-height:1.6; }

/* ---------- CALL SCREEN ---------- */
#screen-call{ display:none; flex-direction:column; height:100vh; }
#screen-call.active{ display:flex; }
#screen-join.hidden{ display:none; }

.call-topbar{ display:flex; align-items:center; gap:14px; padding:14px 18px; flex-shrink:0; }
.id-chip{ display:flex; align-items:center; gap:8px; padding:8px 14px; border-radius:var(--radius-pill); background:var(--glass-fill-strong); border:1px solid var(--glass-border-strong); font-family:var(--font-mono); font-size:12px; }
.live-dot{ width:7px; height:7px; border-radius:50%; background:var(--red); box-shadow:0 0 8px var(--red); animation:pulse 1.6s infinite; }
@keyframes pulse{ 0%{box-shadow:0 0 0 0 rgba(251,85,104,.6)} 70%{box-shadow:0 0 0 8px rgba(251,85,104,0)} 100%{box-shadow:0 0 0 0 rgba(251,85,104,0)} }
.timer-chip{ font-family:var(--font-mono); font-size:12.5px; color:var(--text-1); background:var(--glass-fill); border:1px solid var(--glass-border); padding:7px 13px; border-radius:var(--radius-pill); }
.topbar-right{ margin-left:auto; display:flex; align-items:center; gap:8px; }
.icon-btn{ width:36px; height:36px; border-radius:50%; display:grid; place-items:center; background:var(--glass-fill); border:1px solid var(--glass-border); color:var(--text-1); transition:background .2s, color .2s, transform .2s var(--ease-spring); }
.icon-btn:hover{ background:var(--glass-fill-strong); color:var(--text-0); transform:translateY(-1px); }
.lock-chip{ font-size:11px; padding:5px 10px; border-radius:var(--radius-pill); background:rgba(251,85,104,.15); color:var(--red); display:none; }
.lock-chip.show{ display:inline-block; }

.call-stage{ flex:1; position:relative; overflow:hidden; padding:6px 18px; display:flex; }
.video-grid{ flex:1; display:grid; gap:10px; align-content:center; grid-auto-rows:1fr; }
.video-tile{
  position:relative; border-radius:18px; overflow:hidden; background:linear-gradient(160deg,#141a30,#0a0d1c);
  border:1px solid var(--glass-border); display:flex; align-items:center; justify-content:center; min-height:0;
  transition:box-shadow .3s;
}
.video-tile video{ width:100%; height:100%; object-fit:cover; }
.video-tile.self video{ transform:scaleX(-1); }
.video-tile.speaking{ box-shadow:0 0 0 2.5px var(--cyan), 0 0 30px -6px var(--cyan); }
.tile-avatar-fallback{ width:56px; height:56px; border-radius:50%; display:grid; place-items:center; font-weight:700; font-size:18px; color:#fff; font-family:var(--font-display); background:linear-gradient(135deg,var(--blue),var(--purple)); }
.tile-label{ position:absolute; bottom:9px; left:11px; font-size:11.5px; color:#fff; display:flex; align-items:center; gap:6px; background:rgba(0,0,0,.35); padding:4px 10px; border-radius:var(--radius-pill); backdrop-filter:blur(6px); }
.tile-mute-ic{ position:absolute; bottom:9px; right:9px; width:20px; height:20px; border-radius:50%; background:rgba(251,85,104,.85); display:none; place-items:center; }
.tile-mute-ic.show{ display:grid; }
.tile-status{ position:absolute; top:9px; left:9px; font-size:10px; font-family:var(--font-mono); background:rgba(0,0,0,.4); padding:3px 8px; border-radius:var(--radius-pill); color:var(--amber); display:none; }
.tile-status.show{ display:block; }
.tile-fs-btn{ position:absolute; top:9px; right:9px; width:27px; height:27px; border-radius:50%; background:rgba(0,0,0,.45); display:grid; place-items:center; color:#fff; opacity:0; transition:opacity .2s, background .2s; z-index:5; }
.video-tile:hover .tile-fs-btn{ opacity:1; }
.tile-fs-btn:hover{ background:rgba(0,0,0,.7); }
.tile-fs-btn .ic-collapse{ display:none; }
.video-tile:fullscreen{ border-radius:0; }
.video-tile:fullscreen video{ object-fit:contain; background:#000; }
.video-tile:fullscreen .tile-fs-btn{ opacity:1; }
.video-tile:fullscreen .tile-fs-btn .ic-expand{ display:none; }
.video-tile:fullscreen .tile-fs-btn .ic-collapse{ display:block; }
.video-tile:-webkit-full-screen{ border-radius:0; }
.video-tile:-webkit-full-screen video{ object-fit:contain; background:#000; }
.video-tile:-webkit-full-screen .tile-fs-btn .ic-expand{ display:none; }
.video-tile:-webkit-full-screen .tile-fs-btn .ic-collapse{ display:block; }
.screen-share-tag{ position:absolute; top:9px; left:9px; font-size:10px; font-family:var(--font-mono); background:rgba(79,124,255,.35); border:1px solid rgba(79,124,255,.5); padding:3px 9px; border-radius:var(--radius-pill); color:#fff; display:none; }
.screen-share-tag.show{ display:block; }

.empty-hint{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; color:var(--text-2); text-align:center; padding:20px; }
.empty-hint b{ font-size:15px; color:var(--text-1); }
.empty-hint .link-box{ font-family:var(--font-mono); font-size:12.5px; background:var(--glass-fill-strong); border:1px solid var(--glass-border-strong); padding:8px 14px; border-radius:var(--radius-pill); margin-top:6px; }

.reactions-layer{ position:absolute; inset:0; pointer-events:none; overflow:hidden; }
.floating-reaction{ position:absolute; bottom:110px; font-size:30px; animation:reactUp 2.2s ease-out forwards; }
@keyframes reactUp{ 0%{transform:translateY(0) scale(.6); opacity:0;} 15%{opacity:1; transform:translateY(-26px) scale(1.05);} 100%{transform:translateY(-300px) scale(1); opacity:0;} }

/* side panel */
.side-panel{ position:absolute; top:0; right:0; bottom:0; width:320px; background:var(--surface-0); border-left:1px solid var(--glass-border); transform:translateX(100%); transition:transform .35s var(--ease-out); display:flex; flex-direction:column; z-index:45; }
.side-panel.open{ transform:translateX(0); }
.sp-tabs{ display:flex; padding:14px 14px 0; gap:6px; }
.sp-tab{ flex:1; padding:10px; border-radius:10px 10px 0 0; font-size:12.5px; font-weight:600; color:var(--text-3); border-bottom:2px solid transparent; }
.sp-tab.active{ color:var(--text-0); border-color:var(--blue); }
.sp-close{ position:absolute; top:12px; right:12px; color:var(--text-3); width:26px; height:26px; border-radius:50%; display:grid; place-items:center; }
.sp-close:hover{ background:var(--glass-fill); color:var(--text-0); }
.sp-pane{ display:none; flex-direction:column; flex:1; min-height:0; padding:10px 14px 14px; }
.sp-pane.active{ display:flex; }

.chat-messages{ flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:10px; }
.chat-msg{ display:flex; gap:8px; animation:msgIn .3s var(--ease-out); }
@keyframes msgIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
.chat-msg .av{ width:26px; height:26px; border-radius:50%; display:grid; place-items:center; font-size:10px; font-weight:700; background:linear-gradient(135deg,var(--purple),var(--blue)); color:#fff; flex-shrink:0; font-family:var(--font-display); }
.chat-msg.self{ flex-direction:row-reverse; }
.chat-body{ max-width:78%; }
.chat-head{ display:flex; gap:6px; align-items:baseline; margin-bottom:2px; }
.chat-msg.self .chat-head{ flex-direction:row-reverse; }
.chat-head b{ font-size:11.5px; } .chat-head time{ font-size:9.5px; color:var(--text-3); }
.chat-bubble{ background:var(--glass-fill); border:1px solid var(--glass-border); padding:8px 12px; border-radius:12px 12px 12px 4px; font-size:13px; color:var(--text-1); word-break:break-word; }
.chat-msg.self .chat-bubble{ background:linear-gradient(135deg, rgba(79,124,255,.28), rgba(168,85,247,.16)); border-radius:12px 12px 4px 12px; }
.chat-msg.system .chat-bubble{ background:transparent; border:none; color:var(--text-3); font-size:11.5px; text-align:center; }
.chat-input-row{ display:flex; align-items:center; gap:4px; background:var(--glass-fill); border:1px solid var(--glass-border); border-radius:var(--radius-pill); padding:5px 6px; margin-top:8px; }
.chat-input-row input{ flex:1; background:none; border:none; outline:none; font-size:13px; padding:8px 6px; }
.send-btn{ width:34px; height:34px; border-radius:50%; display:grid; place-items:center; color:var(--blue); }
.send-btn:hover{ background:var(--glass-fill-strong); }

.participants-list{ flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:4px; }
.p-row{ display:flex; align-items:center; gap:10px; padding:9px 8px; border-radius:10px; transition:background .2s; }
.p-row:hover{ background:var(--glass-fill); }
.p-row .av{ width:32px; height:32px; border-radius:50%; display:grid; place-items:center; font-size:11px; font-weight:700; background:linear-gradient(135deg,var(--purple),var(--blue)); color:#fff; flex-shrink:0; font-family:var(--font-display); }
.p-row b{ font-size:13px; display:block; }
.p-row small{ color:var(--text-3); font-size:11px; }
.host-tag{ font-size:9px; background:rgba(168,85,247,.18); color:var(--purple); padding:1.5px 6px; border-radius:var(--radius-pill); margin-left:6px; }
.host-actions{ display:flex; gap:8px; margin-bottom:10px; }

/* toolbar */
.call-toolbar{ display:flex; align-items:center; justify-content:center; gap:16px; padding:14px 16px 18px; flex-shrink:0; flex-wrap:wrap; }
.toolbar-group{ display:flex; align-items:center; gap:6px; background:var(--glass-fill-strong); border:1px solid var(--glass-border-strong); padding:6px; border-radius:var(--radius-pill); backdrop-filter:blur(18px); }
.tool-btn{ width:46px; height:46px; border-radius:50%; display:flex; align-items:center; justify-content:center; position:relative; color:var(--text-2); transition:background .2s, color .2s, transform .18s var(--ease-spring); }
.tool-btn:hover{ background:rgba(255,255,255,.08); color:var(--text-0); transform:translateY(-2px); }
.tool-btn.active{ background:rgba(255,255,255,.1); color:var(--text-0); }
.tool-btn.on{ background:var(--grad-primary); color:#fff; }
.tool-btn.muted-state{ background:rgba(251,85,104,.85); color:#fff; }
.tool-badge{ position:absolute; top:0; right:0; background:var(--red); color:#fff; font-size:9.5px; font-weight:700; min-width:16px; height:16px; border-radius:50%; display:grid; place-items:center; padding:0 3px; }
.end-call-btn{ width:54px; height:54px; border-radius:50%; background:linear-gradient(135deg,#fb5568,#c02a44); color:#fff; box-shadow:0 8px 28px -6px rgba(251,85,104,.6); }
.end-call-btn:hover{ transform:translateY(-2px) scale(1.04); }
.reactions-picker{ position:absolute; bottom:88px; left:50%; transform:translateX(-50%); display:flex; gap:6px; background:var(--surface-1); border:1px solid var(--glass-border-strong); border-radius:var(--radius-pill); padding:7px 9px; z-index:70; display:none; }
.reactions-picker.show{ display:flex; }
.reactions-picker button{ font-size:20px; padding:5px; border-radius:50%; transition:transform .15s var(--ease-spring); }
.reactions-picker button:hover{ transform:scale(1.3); background:var(--glass-fill); }

.toast-stack{ position:fixed; top:16px; right:16px; z-index:9000; display:flex; flex-direction:column; gap:8px; width:min(320px, calc(100vw - 32px)); }
.toast{ padding:12px 14px; border-radius:14px; background:var(--surface-1); border:1px solid var(--glass-border-strong); font-size:12.5px; animation:toastIn .3s var(--ease-spring); box-shadow:0 12px 36px -12px rgba(0,0,0,.6); }
.toast b{ display:block; margin-bottom:2px; font-size:13px; } .toast p{ color:var(--text-2); font-size:11.5px; }
@keyframes toastIn{ from{opacity:0; transform:translateX(24px);} to{opacity:1; transform:translateX(0);} }

.credit-footer{
  position:fixed; left:50%; bottom:8px; transform:translateX(-50%); z-index:5000;
  font-family:var(--font-mono); font-size:10.5px; letter-spacing:.3px; color:var(--text-3);
  background:rgba(10,12,24,.5); backdrop-filter:blur(6px); padding:4px 12px; border-radius:var(--radius-pill);
  border:1px solid var(--glass-border); pointer-events:none; direction:ltr;
}

@media (max-width:720px){
  .credit-footer{ font-size:9.5px; padding:3px 10px; bottom:6px; }
  .side-panel{ width:100%; }
  .call-toolbar{ gap:8px; }
  .toolbar-group{ padding:4px; gap:2px; }
  .tool-btn{ width:40px; height:40px; }
  .end-call-btn{ width:48px; height:48px; }
  .join-card{ padding:26px 20px; }
}
</style>
</head>
<body>

<div class="ambient-bg"><div class="glow glow-a"></div><div class="glow glow-b"></div><div class="grid-overlay"></div></div>
<div class="toast-stack" id="toastStack"></div>
<div class="credit-footer">Built with ♥ by MaxWorld</div>

<!-- =================== JOIN SCREEN =================== -->
<section id="screen-join">
  <div class="join-card glass">
    <div class="brand">
      <svg viewBox="0 0 40 40" class="brand-mark"><circle class="ring r1" cx="20" cy="20" r="17.5"/><circle class="ring r2" cx="20" cy="20" r="11"/><circle class="core" cx="20" cy="20" r="4.5"/></svg>
      <span class="brand-word">یاکریم <span>کال پیتی</span></span>
    </div>
    <h1 id="joinHeading">تماس گروهی واقعی</h1>
    <p class="sub" id="joinSub">اسمتو بنویس، دوربینتو چک کن، و یک روم بساز یا وارد روم دوستت شو. لینک رو کپی کن و برای بقیه بفرست.</p>

    <div class="preview-box">
      <video id="previewVideo" autoplay muted playsinline></video>
      <div class="preview-avatar" id="previewAvatar">YO</div>
      <div class="preview-controls">
        <button class="mini-tool" id="previewMicBtn" title="میکروفون" aria-label="Toggle microphone">
          <svg viewBox="0 0 24 24" width="17" height="17"><path d="M12 15a3 3 0 003-3V6a3 3 0 00-6 0v6a3 3 0 003 3zM19 11a7 7 0 01-14 0M12 19v3" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
        </button>
        <button class="mini-tool" id="previewCamBtn" title="دوربین" aria-label="Toggle camera">
          <svg viewBox="0 0 24 24" width="17" height="17"><path d="M23 7l-7 5 7 5V7z" fill="currentColor"/><rect x="1" y="5" width="15" height="14" rx="3" fill="currentColor"/></svg>
        </button>
      </div>
    </div>

    <div class="field">
      <span>اسم شما</span>
      <input type="text" id="nameInput" placeholder="مثلاً آرین" maxlength="24">
    </div>
    <div class="field">
      <span>کد روم</span>
      <div class="room-row">

<!-- PeerJS — free public cloud broker, used ONLY for signaling (exchanging connection info). -->
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
'use strict';
/* =====================================================================
   YAKARIM CALL PITI — REAL WEBRTC GROUP CALL (single file)
   Signaling: PeerJS public cloud broker (0.peerjs.com)
   Media: direct peer-to-peer WebRTC (mesh topology)
   Room roster + chat: relayed through the room's "host" peer
===================================================================== */

const $ = (s, c = document) => c.querySelector(s);
const $all = (s, c = document) => Array.from(c.querySelectorAll(s));
/* Works for both real DOM elements (addEventListener) AND PeerJS objects
   (Peer / DataConnection / MediaConnection), which are EventEmitters and
   only expose .on(). Using addEventListener on those used to throw and
   silently kill the rest of the join/call flow — this is the fix. */
const on = (el, ev, fn) => {
  if (!el) return;
  if (typeof el.addEventListener === 'function') el.addEventListener(ev, fn);
  else if (typeof el.on === 'function') el.on(ev, fn);
};
const pad2 = n => String(n).padStart(2, '0');
const escapeHTML = s => (s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const randId = (len = 6) => Array.from({ length: len }, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random() * 32)]).join('');
const initialsOf = name => (name || 'You').trim().split(/\s+/).slice(0, 2).map(w => w[0]?.toUpperCase() || '').join('') || 'YO';
/* A room code becomes part of a PeerJS peer ID, which travels in a URL path
   to the signaling server — Persian/Arabic digits, spaces, or symbols in it
   would silently break connecting. Normalize to plain A-Z0-9 only. */
const sanitizeRoomCode = s => (s || '')
  .replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
  .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))
  .toUpperCase()
  .replace(/[^A-Z0-9]/g, '')
  .slice(0, 12);

/* ---------------- ICE servers: public STUN + a free public TURN (openrelay) for better NAT traversal ---------------- */
const ICE_SERVERS = [
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun:stun1.l.google.com:19302' },
  { urls: 'stun:stun2.l.google.com:19302' },
  { urls: 'stun:stun3.l.google.com:19302' },
  { urls: 'stun:stun4.l.google.com:19302' },
  { urls: 'stun:global.stun.twilio.com:3478' },
  { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
  { urls: 'turn:openrelay.metered.ca:80?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' },
  { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
  { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' },
  { urls: 'turns:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' },
];
/* iceTransportPolicy stays 'all' (default) so direct P2P is tried first and
   TURN relay is only used as a fallback when a direct route isn't possible. */
const PEER_RTC_CONFIG = { iceServers: ICE_SERVERS, iceCandidatePoolSize: 4 };

const S = {
  peer: null, myId: null, myName: 'You',
  roomCode: null, hostId: null, isHost: false,
  localStream: null, screenStream: null, micOn: true, camOn: true,
  roster: new Map(),          // id -> {id, name}
  dataConns: new Map(),       // id -> DataConnection (host<->guest links)
  mediaCalls: new Map(),      // id -> MediaConnection
  remoteStreams: new Map(),   // id -> MediaStream
  startedAt: null, timerHandle: null,
  chatUnread: 0, locked: false,
};

/* ---------------------------------------------------------------------
   Toasts
--------------------------------------------------------------------- */
function toast(title, body = '', duration = 4000) {
  const stack = $('#toastStack');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<b>${escapeHTML(title)}</b>${body ? `<p>${escapeHTML(body)}</p>` : ''}`;
  stack.appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, duration);
}

/* ---------------------------------------------------------------------
   Join screen: camera/mic preview
--------------------------------------------------------------------- */
async function initPreview() {
  const params = new URLSearchParams(location.search);
  const roomFromUrl = params.get('room');
  if (roomFromUrl) {
    $('#roomInput').value = sanitizeRoomCode(roomFromUrl);
    $('#joinHeading').textContent = 'ملحق شدن به تماس';
    $('#joinSub').textContent = 'داری به یک روم موجود وصل می‌شی. اسمتو بنویس و وارد شو.';
  }
  $('#previewAvatar').textContent = initialsOf($('#nameInput').value);
  on($('#nameInput'), 'input', () => { $('#previewAvatar').textContent = initialsOf($('#nameInput').value); });

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    S.localStream = stream;
    $('#previewVideo').srcObject = stream;
    $('#previewAvatar').style.display = 'none';
    $('#previewMicBtn').classList.add('on');
    $('#previewCamBtn').classList.add('on');
  } catch (err) {
    setJoinStatus('دوربین یا میکروفون در دسترس نیست — می‌تونی بدون اون‌ها هم وارد بشی.', 'warn');
  }
  on($('#previewMicBtn'), 'click', () => toggleLocalTrack('audio', $('#previewMicBtn')));
  on($('#previewCamBtn'), 'click', () => {
    toggleLocalTrack('video', $('#previewCamBtn'));
    $('#previewAvatar').style.display = S.camOn ? 'none' : 'grid';
  });
}
function toggleLocalTrack(kind, btn) {
  if (!S.localStream) { btn.classList.toggle('off'); return; }
  const tracks = kind === 'audio' ? S.localStream.getAudioTracks() : S.localStream.getVideoTracks();
  const turningOn = btn.classList.contains('off');
  tracks.forEach(t => t.enabled = turningOn);
  btn.classList.toggle('off', !turningOn);
  if (kind === 'audio') S.micOn = turningOn; else S.camOn = turningOn;
}
function setJoinStatus(msg, kind) {
  const el = $('#joinStatus');
  el.textContent = msg;
  el.className = 'join-status' + (kind ? ' ' + kind : '');
}

on($('#roomInput'), 'input', e => {
  const clean = sanitizeRoomCode(e.target.value);
  if (clean !== e.target.value) e.target.value = clean;
});
on($('#generateRoomBtn'), 'click', () => { $('#roomInput').value = randId(6); });
on($('#copyJoinLinkBtn'), 'click', () => {
  let code = sanitizeRoomCode($('#roomInput').value);
  if (!code) { code = randId(6); }
  $('#roomInput').value = code;
  const link = location.origin + location.pathname + '?room=' + code;
  navigator.clipboard?.writeText(link).then(() => setJoinStatus('لینک دعوت کپی شد: ' + link, 'ok'))
    .catch(() => setJoinStatus('لینک دعوت: ' + link, 'ok'));
});

/* ---------------------------------------------------------------------
   Join flow — decide host vs guest, open Peer, wire events
--------------------------------------------------------------------- */
on($('#joinBtn'), 'click', handleJoinClick);
async function handleJoinClick() {
  const name = $('#nameInput').value.trim();
  if (!name) { setJoinStatus('لطفاً اسمتو بنویس.', 'err'); $('#nameInput').focus(); return; }
  S.myName = name;
  let roomCode = sanitizeRoomCode($('#roomInput').value);
  if (!roomCode) roomCode = randId(6);
  S.roomCode = roomCode;
  S.hostId = 'ykp-host-' + roomCode;

  $('#joinBtn').disabled = true;
  setJoinStatus('در حال اتصال به سرور سیگنالینگ…');

  // Try to become the host first (claim deterministic host ID for this room)
  const hostPeer = new Peer(S.hostId, { config: PEER_RTC_CONFIG });

  let settled = false;
  const fallbackToGuest = () => {
    if (settled) return; settled = true;
    hostPeer.destroy();
    becomeGuest(roomCode);
  };

  hostPeer.on('open', id => {
    if (settled) return; settled = true;
    S.peer = hostPeer; S.myId = id; S.isHost = true;
    S.roster.set(id, { id, name: S.myName });
    setJoinStatus('روم ساخته شد. منتظر بقیه…', 'ok');
    wireHostPeerEvents(hostPeer);
    enterCallScreen();
  });
  hostPeer.on('error', err => {
    if (err.type === 'unavailable-id') { fallbackToGuest(); }
    else if (!settled) { settled = true; setJoinStatus('اتصال ناموفق بود: ' + err.type, 'err'); $('#joinBtn').disabled = false; }
  });
  hostPeer.on('disconnected', () => { if (settled && S.isHost) hostPeer.reconnect(); });
  // safety timeout in case 'open' never fires (extra slack for slow/mobile networks)
  setTimeout(fallbackToGuest, 9000);
}

function becomeGuest(roomCode) {
  setJoinStatus('در حال ملحق شدن به روم…');
  const myId = 'ykp-guest-' + roomCode + '-' + randId(5);
  const peer = new Peer(myId, { config: PEER_RTC_CONFIG });
  peer.on('disconnected', () => peer.reconnect());

  peer.on('open', id => {
    S.peer = peer; S.myId = id; S.isHost = false;
    const conn = peer.connect(S.hostId, { reliable: true });
    S.dataConns.set(S.hostId, conn);
    on(conn, 'open', () => {
      conn.send({ type: 'join', id: S.myId, name: S.myName });
      setJoinStatus('وصل شد.', 'ok');
      enterCallScreen();
    });
    on(conn, 'data', data => handleData(S.hostId, data));
    on(conn, 'close', () => {
      toast('اتصال با هاست قطع شد', 'ممکنه چت گروهی دیگه کار نکنه، ولی تماس‌های برقرار شده ادامه دارن.');
    });
    on(conn, 'error', () => {});
    wireGuestPeerEvents(peer);

    setTimeout(() => {
      if (!$('#screen-call').classList.contains('active')) {
        setJoinStatus('روم پیدا نشد یا هاست آفلاینه. یک روم جدید بساز.', 'err');
        $('#joinBtn').disabled = false;
      }
    }, 7000);
  });
  peer.on('error', err => {
    setJoinStatus('اتصال ناموفق بود: ' + err.type, 'err');
    $('#joinBtn').disabled = false;
  });
}

/* ---------------------------------------------------------------------
   Peer event wiring (host + guest share the call-answering logic)
--------------------------------------------------------------------- */
function wireHostPeerEvents(peer) {
  on(peer, 'connection', conn => {
    if (S.locked) { conn.on('open', () => { conn.send({ type: 'room-locked' }); conn.close(); }); return; }
    on(conn, 'data', data => handleData(conn.peer, data));
    on(conn, 'open', () => { S.dataConns.set(conn.peer, conn); });
    on(conn, 'close', () => handlePeerLeft(conn.peer));
  });
  wireCallAnswering(peer);
}
function wireGuestPeerEvents(peer) { wireCallAnswering(peer); }

function wireCallAnswering(peer) {
  on(peer, 'call', call => {
    call.answer(S.localStream || undefined);
    registerMediaCall(call);
  });
}

function registerMediaCall(call) {
  S.mediaCalls.set(call.peer, call);
  on(call, 'stream', remoteStream => {
    S.remoteStreams.set(call.peer, remoteStream);
    upsertVideoTile(call.peer);
  });
  on(call, 'close', () => removeParticipant(call.peer));
  on(call, 'error', () => removeParticipant(call.peer));

  // If the underlying connection stalls or fails (common on flaky mobile
  // networks / strict NATs), retry once instead of leaving a dead tile.
  const pc = call.peerConnection;
  if (pc) {
    pc.addEventListener('iceconnectionstatechange', () => {
      if ((pc.iceConnectionState === 'failed' || pc.iceConnectionState === 'disconnected') && S.mediaCalls.get(call.peer) === call) {
        S.mediaCalls.delete(call.peer);
        S.remoteStreams.delete(call.peer);
        $(`#status-${call.peer}`)?.classList.add('show');
        setTimeout(() => maybeCallPeer(call.peer), 1200);
      }
    });
  }
}

/* Only the lexicographically-smaller peer id initiates the call, to avoid duplicate simultaneous calls */
function maybeCallPeer(remoteId) {
  if (remoteId === S.myId || S.mediaCalls.has(remoteId) || !S.roster.has(remoteId)) return;
  if (S.myId < remoteId) {
    const call = S.peer.call(remoteId, S.localStream || undefined);
    if (call) registerMediaCall(call);
  }
}

/* ---------------------------------------------------------------------
   Data protocol handling
--------------------------------------------------------------------- */
function handleData(fromId, msg) {
  if (!msg || !msg.type) return;
  switch (msg.type) {
    case 'room-locked':
      setJoinStatus('این روم قفل شده و پذیرای عضو جدید نیست.', 'err');
      $('#joinBtn').disabled = false;
      break;
    case 'join': {
      // host receives a new guest joining
      S.roster.set(msg.id, { id: msg.id, name: msg.name });
      const rosterArr = Array.from(S.roster.values());
      const conn = S.dataConns.get(msg.id);
      conn && conn.send({ type: 'roster', peers: rosterArr, hostId: S.myId });
      broadcastExcept(msg.id, { type: 'peer-joined', peer: { id: msg.id, name: msg.name } });
      addSystemChat(`${msg.name} به تماس پیوست`);
      renderParticipants();
      maybeCallPeer(msg.id);
      break;
    }
    case 'roster': {
      msg.peers.forEach(p => S.roster.set(p.id, p));
      renderParticipants();
      msg.peers.forEach(p => maybeCallPeer(p.id));
      break;
    }
    case 'peer-joined':
      S.roster.set(msg.peer.id, msg.peer);
      addSystemChat(`${msg.peer.name} به تماس پیوست`);
      renderParticipants();
      maybeCallPeer(msg.peer.id);
      break;
    case 'peer-left':
      handlePeerLeft(msg.id);
      break;
    case 'chat':
      addChatMessage(msg.name, msg.text, false, msg.id);
      if (S.isHost) broadcastExcept(msg.id, msg);
      break;
    case 'reaction':
      spawnFloatingReaction(msg.emoji);
      if (S.isHost) broadcastExcept(fromId, msg);
      break;
    case 'mute-all':
      if (!S.micOn) break;
      toggleMic(true);
      toast('هاست همه رو بی‌صدا کرد', '');
      break;
    case 'screen':
      $(`#screentag-${msg.id}`)?.classList.toggle('show', msg.sharing);
      if (S.isHost) broadcastExcept(fromId, msg);
      break;
  }
}
function broadcastExcept(exceptId, msg) {
  S.dataConns.forEach((conn, id) => { if (id !== exceptId && conn.open) conn.send(msg); });
}
function broadcastAll(msg) { S.dataConns.forEach(conn => conn.open && conn.send(msg)); }

function handlePeerLeft(id) {
  const p = S.roster.get(id);
  S.roster.delete(id);
  S.dataConns.delete(id);
  const call = S.mediaCalls.get(id); if (call) call.close();
  S.mediaCalls.delete(id);
  S.remoteStreams.delete(id);
  removeVideoTile(id);
  if (p) addSystemChat(`${p.name} تماس رو ترک کرد`);
  renderParticipants();
  if (S.isHost) broadcastAll({ type: 'peer-left', id });
}
function removeParticipant(id) { handlePeerLeft(id); }

/* ---------------------------------------------------------------------
   Call screen UI: enter / video grid / timer
--------------------------------------------------------------------- */
function enterCallScreen() {
  if ($('#screen-call').classList.contains('active')) return;
  $('#screen-join').classList.add('hidden');
  $('#screen-call').classList.add('active');
  $('#roomLabel').textContent = S.roomCode;
  const link = location.origin + location.pathname + '?room=' + S.roomCode;
  $('#inviteLinkText').textContent = link;
  upsertVideoTile(S.myId, true);
  renderParticipants();
  S.startedAt = Date.now();
  S.timerHandle = setInterval(updateTimer, 1000);
  attachRipples();
}
function updateTimer() {
  const secs = Math.floor((Date.now() - S.startedAt) / 1000);
  const h = Math.floor(secs / 3600), m = Math.floor((secs % 3600) / 60), s = secs % 60;
  $('#callTimer').textContent = h > 0 ? `${pad2(h)}:${pad2(m)}:${pad2(s)}` : `${pad2(m)}:${pad2(s)}`;
}

function upsertVideoTile(id, isSelf = false) {
  $('#emptyHint').style.display = 'none';
  let tile = $(`.video-tile[data-id="${id}"]`);
  const name = isSelf ? (S.myName + ' (شما)') : (S.roster.get(id)?.name || 'مهمان');
  if (!tile) {
    tile = document.createElement('div');
    tile.className = 'video-tile' + (isSelf ? ' self' : '');
    tile.dataset.id = id;
    tile.innerHTML = `
      <video autoplay playsinline ${isSelf ? 'muted' : ''}></video>
      <div class="tile-avatar-fallback">${initialsOf(name)}</div>
      <div class="tile-status${isSelf ? '' : ' show'}" id="status-${id}">در حال اتصال…</div>
      <div class="screen-share-tag" id="screentag-${id}">🖥 اشتراک صفحه</div>
      <button class="tile-fs-btn" type="button" aria-label="تمام‌صفحه">
        <svg class="ic-expand" viewBox="0 0 24 24" width="14" height="14"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <svg class="ic-collapse" viewBox="0 0 24 24" width="14" height="14"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="tile-label">${escapeHTML(name)}</div>
      <div class="tile-mute-ic"><svg viewBox="0 0 24 24" width="11" height="11"><path d="M12 15a3 3 0 003-3V6a3 3 0 00-6 0v3M19 11a7 7 0 01-10.6 6M5 5l14 14" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg></div>
    `;
    $('#videoGrid').appendChild(tile);
    on($('.tile-fs-btn', tile), 'click', e => { e.stopPropagation(); toggleTileFullscreen(tile); });
  }
  const video = $('video', tile);
  const stream = isSelf ? S.localStream : S.remoteStreams.get(id);
  if (stream) { video.srcObject = stream; $('.tile-avatar-fallback', tile).style.display = 'none'; $(`#status-${id}`)?.classList.remove('show'); }
  relayoutGrid();
}
function removeVideoTile(id) { $(`.video-tile[data-id="${id}"]`)?.remove(); relayoutGrid(); }

/* ---------------------------------------------------------------------
   Fullscreen toggle for any video tile (self view or a shared screen)
--------------------------------------------------------------------- */
function toggleTileFullscreen(tile) {
  const current = document.fullscreenElement || document.webkitFullscreenElement;
  if (current === tile) {
    (document.exitFullscreen || document.webkitExitFullscreen)?.call(document);
  } else {
    const req = tile.requestFullscreen || tile.webkitRequestFullscreen;
    req?.call(tile);
  }
}
function relayoutGrid() {
  const grid = $('#videoGrid');
  const n = grid.children.length;
  if (n === 0) { $('#emptyHint').style.display = 'flex'; return; }
  const cols = Math.ceil(Math.sqrt(n));
  grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
}

/* ---------------------------------------------------------------------
   Participants panel
--------------------------------------------------------------------- */
function renderParticipants() {
  const list = $('#participantsList');
  list.innerHTML = '';
  const meRow = document.createElement('div');
  meRow.className = 'p-row';
  meRow.innerHTML = `<span class="av">${initialsOf(S.myName)}</span>
    <div><b>${escapeHTML(S.myName)} ${S.isHost ? '<span class="host-tag">هاست</span>' : ''}</b><small>شما</small></div>`;
  list.appendChild(meRow);
  S.roster.forEach((p, id) => {
    if (id === S.myId) return;
    const row = document.createElement('div');
    row.className = 'p-row';
    row.innerHTML = `<span class="av">${initialsOf(p.name)}</span>
      <div><b>${escapeHTML(p.name)} ${id === S.hostId ? '<span class="host-tag">هاست</span>' : ''}</b><small>${S.remoteStreams.has(id) ? 'متصل' : 'در حال اتصال…'}</small></div>`;
    list.appendChild(row);
  });
  const count = S.roster.size + 1;
  $('#spCount').textContent = count;
  $('#peopleBadge').textContent = count;
  $('#hostActions').style.display = S.isHost ? 'flex' : 'none';
}

/* ---------------------------------------------------------------------
   Chat
--------------------------------------------------------------------- */
function addChatMessage(name, text, self, id) {
  const wrap = $('#chatMessages');
  const el = document.createElement('div');
  el.className = 'chat-msg' + (self ? ' self' : '');
  el.innerHTML = `<span class="av">${initialsOf(name)}</span>
    <div class="chat-body">
      <div class="chat-head"><b>${escapeHTML(name)}</b><time>${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</time></div>
      <div class="chat-bubble">${escapeHTML(text)}</div>
    </div>`;
  wrap.appendChild(el);
  wrap.scrollTop = wrap.scrollHeight;
  if (!self && !$('#sidePanel').classList.contains('open')) {
    S.chatUnread++;
    $('#chatBadge').style.display = 'grid';
    $('#chatBadge').textContent = S.chatUnread;
  }
}
function addSystemChat(text) {
  const wrap = $('#chatMessages');
  const el = document.createElement('div');
  el.className = 'chat-msg system';
  el.innerHTML = `<div class="chat-body" style="max-width:100%;margin:0 auto"><div class="chat-bubble">${escapeHTML(text)}</div></div>`;
  wrap.appendChild(el);
  wrap.scrollTop = wrap.scrollHeight;
}
on($('#chatForm'), 'submit', e => {
  e.preventDefault();
  const input = $('#chatInput');
  const text = input.value.trim();
  if (!text) return;
  addChatMessage(S.myName, text, true);
  const msg = { type: 'chat', id: S.myId, name: S.myName, text };
  if (S.isHost) broadcastAll(msg);
  else S.dataConns.get(S.hostId)?.send(msg);
  input.value = '';
});

/* ---------------------------------------------------------------------
   Side panel tabs
--------------------------------------------------------------------- */
function openPanel(tab) {
  $('#sidePanel').classList.add('open');
  $all('.sp-tab').forEach(t => t.classList.toggle('active', t.dataset.sp === tab));
  $all('.sp-pane').forEach(p => p.classList.toggle('active', p.dataset.pane === tab));
  if (tab === 'chat') { S.chatUnread = 0; $('#chatBadge').style.display = 'none'; }
}
function closePanel() { $('#sidePanel').classList.remove('open'); }
on($('#chatToggleBtn'), 'click', () => {
  const willOpen = !($('#sidePanel').classList.contains('open') && $('.sp-tab[data-sp="chat"]').classList.contains('active'));
  willOpen ? openPanel('chat') : closePanel();
});
on($('#peopleToggleBtn'), 'click', () => {
  const willOpen = !($('#sidePanel').classList.contains('open') && $('.sp-tab[data-sp="people"]').classList.contains('active'));
  willOpen ? openPanel('people') : closePanel();
});
$all('.sp-tab').forEach(t => on(t, 'click', () => openPanel(t.dataset.sp)));
on($('#spCloseBtn'), 'click', closePanel);

/* ---------------------------------------------------------------------
   Toolbar: mic / cam / screen share / reactions / leave / mute-all / lock / copy link
--------------------------------------------------------------------- */
on($('#micBtn'), 'click', () => toggleMic());
function toggleMic(forceOff) {
  S.micOn = forceOff ? false : !S.micOn;
  S.localStream?.getAudioTracks().forEach(t => t.enabled = S.micOn);
  $('#micBtn').classList.toggle('active', S.micOn);
  $('#micBtn').classList.toggle('muted-state', !S.micOn);
  $(`.video-tile[data-id="${S.myId}"] .tile-mute-ic`)?.classList.toggle('show', !S.micOn);
}
on($('#camBtn'), 'click', () => {
  S.camOn = !S.camOn;
  S.localStream?.getVideoTracks().forEach(t => t.enabled = S.camOn);
  $('#camBtn').classList.toggle('active', S.camOn);
  $('#camBtn').classList.toggle('muted-state', !S.camOn);
  const fb = $(`.video-tile[data-id="${S.myId}"] .tile-avatar-fallback`);
  if (fb) fb.style.display = S.camOn ? 'none' : 'grid';
});

on($('#screenBtn'), 'click', toggleScreenShare);
async function toggleScreenShare() {
  const btn = $('#screenBtn');
  if (S.screenStream) { stopScreenShare(); return; }
  try {
    // audio:true asks for tab/system audio where the browser/OS supports it (e.g. "share tab audio" checkbox in Chrome)
    const stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
    S.screenStream = stream;
    btn.classList.add('on');

    replaceOutgoingTrack('video', stream.getVideoTracks()[0]);
    const screenAudioTrack = stream.getAudioTracks()[0];
    if (screenAudioTrack) replaceOutgoingTrack('audio', screenAudioTrack);

    const tile = $(`.video-tile[data-id="${S.myId}"] video`);
    if (tile) tile.srcObject = stream;
    $(`#screentag-${S.myId}`)?.classList.add('show');
    broadcastScreenStatus(true);

    toast('اشتراک صفحه فعال شد', screenAudioTrack ? 'تصویر و صدای صفحه برای بقیه ارسال می‌شه.' : 'تصویر صفحه برای بقیه ارسال می‌شه (بدون صدای سیستم).');

    // Fires when the user clicks the browser's own "Stop sharing" bar
    stream.getVideoTracks()[0].addEventListener('ended', () => stopScreenShare());
  } catch { toast('اشتراک صفحه لغو شد', ''); }
}
function stopScreenShare() {
  const btn = $('#screenBtn');
  S.screenStream?.getTracks().forEach(t => t.stop());
  S.screenStream = null;
  btn.classList.remove('on');
  replaceOutgoingTrack('video', S.localStream?.getVideoTracks()[0] || null);
  replaceOutgoingTrack('audio', S.localStream?.getAudioTracks()[0] || null);
  const tile = $(`.video-tile[data-id="${S.myId}"] video`);
  if (tile && S.localStream) tile.srcObject = S.localStream;
  $(`#screentag-${S.myId}`)?.classList.remove('show');
  // exit fullscreen if the shared tile happened to be in fullscreen
  const fsTile = document.fullscreenElement || document.webkitFullscreenElement;
  if (fsTile && fsTile.dataset && fsTile.dataset.id === S.myId) (document.exitFullscreen || document.webkitExitFullscreen)?.call(document);
  broadcastScreenStatus(false);
}
function broadcastScreenStatus(sharing) {
  const msg = { type: 'screen', id: S.myId, sharing };
  if (S.isHost) broadcastAll(msg); else S.dataConns.get(S.hostId)?.send(msg);
}
function replaceOutgoingTrack(kind, track) {
  S.mediaCalls.forEach(call => {
    const sender = call.peerConnection?.getSenders().find(s => s.track && s.track.kind === kind);
    if (sender && track) sender.replaceTrack(track).catch(() => {});
  });
}

const reactionsPicker = $('#reactionsPicker');
on($('#reactionsBtn'), 'click', e => { e.stopPropagation(); reactionsPicker.classList.toggle('show'); });
$all('button', reactionsPicker).forEach(b => on(b, 'click', () => {
  spawnFloatingReaction(b.textContent);
  const msg = { type: 'reaction', id: S.myId, emoji: b.textContent };
  if (S.isHost) broadcastAll(msg); else S.dataConns.get(S.hostId)?.send(msg);
  reactionsPicker.classList.remove('show');
}));
on(document, 'click', e => { if (!e.target.closest('#reactionsBtn') && !e.target.closest('#reactionsPicker')) reactionsPicker.classList.remove('show'); });
function spawnFloatingReaction(emoji) {
  const layer = $('#reactionsLayer');
  const el = document.createElement('div');
  el.className = 'floating-reaction';
  el.textContent = emoji;
  el.style.left = (20 + Math.random() * 60) + '%';
  layer.appendChild(el);
  setTimeout(() => el.remove(), 2300);
}

on($('#muteAllBtn'), 'click', () => { broadcastAll({ type: 'mute-all' }); toast('درخواست بی‌صدا شدن به همه ارسال شد', ''); });
on($('#lockRoomBtn'), 'click', () => {
  S.locked = !S.locked;
  $('#lockChip').classList.toggle('show', S.locked);
  $('#lockRoomBtn').textContent = S.locked ? 'باز کردن قفل' : 'قفل روم';
  toast(S.locked ? 'روم قفل شد' : 'روم باز شد', S.locked ? 'عضو جدید نمی‌تونه وارد بشه.' : 'عضو جدید می‌تونه وارد بشه.');
});
on($('#copyLinkBtn'), 'click', () => {
  const link = location.origin + location.pathname + '?room=' + S.roomCode;
  navigator.clipboard?.writeText(link).then(() => toast('لینک دعوت کپی شد', link)).catch(() => toast('لینک دعوت', link, 6000));
});

on($('#leaveBtn'), 'click', () => {
  clearInterval(S.timerHandle);
  if (S.isHost) broadcastAll({ type: 'peer-left', id: S.myId });
  S.dataConns.forEach(c => c.close());
  S.mediaCalls.forEach(c => c.close());
  S.localStream?.getTracks().forEach(t => t.stop());
  S.screenStream?.getTracks().forEach(t => t.stop());
  S.peer?.destroy();
  location.href = location.origin + location.pathname;
});

/* ---------------------------------------------------------------------
   Ripple micro-interaction
--------------------------------------------------------------------- */
function attachRipples() {
  $all('.btn, .tool-btn, .mini-tool, .icon-btn').forEach(el => {
    if (el._rippled) return; el._rippled = true;
    on(el, 'click', e => {
      const rect = el.getBoundingClientRect();
      const r = document.createElement('span');
      const size = Math.max(rect.width, rect.height) * 1.3;
      r.style.cssText = `position:absolute;border-radius:50%;background:rgba(255,255,255,.45);pointer-events:none;
        width:${size}px;height:${size}px;left:${e.clientX - rect.left - size / 2}px;top:${e.clientY - rect.top - size / 2}px;
        transform:scale(0);opacity:.6;transition:transform .6s cubic-bezier(.16,1,.3,1), opacity .6s;`;
      el.style.position = el.style.position || 'relative';
      el.style.overflow = 'hidden';
      el.appendChild(r);
      requestAnimationFrame(() => { r.style.transform = 'scale(3)'; r.style.opacity = '0'; });
      setTimeout(() => r.remove(), 650);
    });
  });
}

initPreview();
attachRipples();
</script>
