<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What's Yakarim — پیام‌رسان شخصی</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

:root{
  --void:#0a0a12;
  --surface:#13131f;
  --surface-2:#1a1a29;
  --border:rgba(255,255,255,0.08);
  --text:#f1f0f7;
  --muted:#8b8aa3;
  --violet:#7c6ff2;
  --cyan:#45d9e0;
  --magenta:#e85fd6;
  --grad: linear-gradient(135deg, var(--violet), var(--cyan) 55%, var(--magenta));
  --radius:16px;
}
[data-theme="light"]{
  --void:#f3f2fa;
  --surface:#ffffff;
  --surface-2:#f2f1fa;
  --border:rgba(20,20,40,0.08);
  --text:#16151f;
  --muted:#6b6a80;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  font-family:'Vazirmatn','Space Grotesk',sans-serif;
  background:var(--void);
  color:var(--text);
  height:100vh;
  overflow:hidden;
  transition:background .3s ease, color .3s ease;
}
::-webkit-scrollbar{width:6px; height:6px;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:10px;}
.mono{font-family:'JetBrains Mono',monospace;}

/* ---------- Aurora bg ---------- */
.aurora-bg{
  position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;
}
.aurora-bg span{
  position:absolute; border-radius:50%; filter:blur(80px); opacity:.35;
  animation:float 18s ease-in-out infinite;
}
.aurora-bg span:nth-child(1){width:420px;height:420px;background:var(--violet); top:-10%; left:-5%; animation-delay:0s;}
.aurora-bg span:nth-child(2){width:380px;height:380px;background:var(--cyan); top:30%; right:-10%; animation-delay:4s;}
.aurora-bg span:nth-child(3){width:300px;height:300px;background:var(--magenta); bottom:-10%; left:20%; animation-delay:8s;}
@keyframes float{
  0%,100%{transform:translate(0,0) scale(1);}
  50%{transform:translate(30px,-40px) scale(1.15);}
}

/* ---------- Auth screen ---------- */
#auth-screen{
  position:relative; z-index:1; height:100vh; display:flex; align-items:center; justify-content:center;
}
.auth-card{
  width:380px; max-width:90vw; padding:36px 32px; border-radius:24px;
  background:rgba(19,19,31,0.6); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
  border:1px solid var(--border);
  box-shadow:0 20px 60px rgba(0,0,0,0.5);
  animation:cardIn .6s cubic-bezier(.16,1,.3,1);
}
[data-theme="light"] .auth-card{background:rgba(255,255,255,0.75);}
@keyframes cardIn{from{opacity:0; transform:translateY(24px) scale(.97);} to{opacity:1; transform:translateY(0) scale(1);}}
.logo-mark{
  width:64px;height:64px;border-radius:18px;background:#f4f1ea;
  display:flex;align-items:center;justify-content:center;
  margin-bottom:16px; padding:8px;
  box-shadow:0 8px 24px rgba(124,111,242,0.35);
}
.logo-mark img{width:100%; height:100%; object-fit:contain;}
.brand-row{display:flex; align-items:center; gap:10px; margin-bottom:18px;}
.brand-mini{width:30px;height:30px;border-radius:9px;background:#f4f1ea; display:flex;align-items:center;justify-content:center; padding:4px; flex-shrink:0;}
.brand-mini img{width:100%;height:100%;object-fit:contain;}
.brand-name{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:16px;}
.auth-title{font-family:'Space Grotesk',sans-serif; font-size:24px; font-weight:700; margin-bottom:4px;}
.auth-sub{color:var(--muted); font-size:13.5px; margin-bottom:24px;}
.field{margin-bottom:14px;}
.field label{font-size:12.5px; color:var(--muted); display:block; margin-bottom:6px;}
.field-input-wrap{position:relative;}
.field input{
  width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--border);
  background:var(--surface-2); color:var(--text); font-size:14px; outline:none;
  transition:border-color .2s, box-shadow .2s;
  font-family:inherit;
}
.field input:focus{border-color:var(--violet); box-shadow:0 0 0 3px rgba(124,111,242,0.15);}
.toggle-pass{
  position:absolute; left:10px; top:50%; transform:translateY(-50%);
  background:none; border:none; color:var(--muted); cursor:pointer; font-size:12px;
}
.remember-row{display:flex; align-items:center; gap:8px; margin-bottom:18px; font-size:13px; color:var(--muted);}
.btn-primary{
  width:100%; padding:13px; border-radius:12px; border:none; cursor:pointer;
  background:var(--grad); color:#fff; font-weight:600; font-size:14.5px;
  font-family:'Space Grotesk',sans-serif;
  position:relative; overflow:hidden;
  transition:transform .15s, box-shadow .15s;
}
.btn-primary:hover{transform:translateY(-1px); box-shadow:0 10px 30px rgba(124,111,242,0.35);}
.btn-primary:active{transform:translateY(0);}
.btn-primary:disabled{opacity:.6; cursor:default;}
.auth-switch{text-align:center; margin-top:18px; font-size:13px; color:var(--muted);}
.auth-switch a{color:var(--cyan); cursor:pointer; text-decoration:none; font-weight:500;}
.error-msg{
  background:rgba(232,95,95,0.12); border:1px solid rgba(232,95,95,0.3); color:#ff9b9b;
  padding:9px 12px; border-radius:10px; font-size:12.5px; margin-bottom:14px;
  animation:shake .35s;
}
@keyframes shake{
  0%,100%{transform:translateX(0);} 20%{transform:translateX(-6px);} 40%{transform:translateX(6px);} 60%{transform:translateX(-4px);} 80%{transform:translateX(4px);}
}
.spinner{
  width:16px;height:16px;border-radius:50%; border:2px solid rgba(255,255,255,0.4); border-top-color:#fff;
  animation:spin .7s linear infinite; display:inline-block; vertical-align:middle; margin-left:8px;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* ---------- App shell ---------- */
#app-screen{display:none; height:100vh; position:relative; z-index:1;}
.shell{display:grid; grid-template-columns:76px 300px 1fr; height:100vh;}
.shell.with-panel{grid-template-columns:76px 300px 1fr 280px;}
@media (max-width:900px){
  .shell, .shell.with-panel{grid-template-columns:0 0 1fr;}
}

/* rail */
.rail{
  background:var(--surface); border-left:1px solid var(--border);
  display:flex; flex-direction:column; align-items:center; padding:18px 0; gap:14px;
}
.rail-avatar{
  width:42px;height:42px;border-radius:13px; display:flex;align-items:center;justify-content:center;
  color:#fff; font-weight:700; font-size:15px; cursor:pointer; position:relative;
  font-family:'Space Grotesk',sans-serif;
}
.status-dot{
  position:absolute; bottom:-2px; left:-2px; width:11px; height:11px; border-radius:50%;
  background:#4ade80; border:2px solid var(--surface);
}
.rail-btn{
  width:42px;height:42px;border-radius:12px; display:flex;align-items:center;justify-content:center;
  background:transparent; border:none; color:var(--muted); cursor:pointer; font-size:18px;
  transition:background .15s, color .15s;
}
.rail-btn:hover, .rail-btn.active{background:var(--surface-2); color:var(--text);}
.rail-spacer{flex:1;}

/* sidebar (chat list) */
.sidebar{
  background:var(--surface); border-left:1px solid var(--border); display:flex; flex-direction:column;
}
.sidebar-head{padding:18px 16px 12px;}
.sidebar-head h1{font-family:'Space Grotesk',sans-serif; font-size:19px; font-weight:700;}
.search-box{
  margin:0 16px 10px; position:relative;
}
.search-box input{
  width:100%; padding:10px 14px 10px 34px; border-radius:11px; border:1px solid var(--border);
  background:var(--surface-2); color:var(--text); font-size:13px; outline:none; font-family:inherit;
}
.search-box .icn{position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:13px;}
.new-chat-btn{
  margin:0 16px 12px; padding:10px; border-radius:11px; border:1px dashed var(--border);
  background:none; color:var(--muted); font-size:12.5px; cursor:pointer; text-align:center;
  transition:border-color .15s, color .15s;
}
.new-chat-btn:hover{border-color:var(--violet); color:var(--violet);}
.chat-list{flex:1; overflow-y:auto; padding:0 8px;}
.chat-item{
  display:flex; align-items:center; gap:10px; padding:10px 8px; border-radius:13px; cursor:pointer;
  margin-bottom:2px; position:relative; transition:background .15s;
}
.chat-item:hover{background:var(--surface-2);}
.chat-item.active{background:linear-gradient(135deg, rgba(124,111,242,0.16), rgba(69,217,224,0.1));}
.chat-avatar{
  width:44px;height:44px;border-radius:13px; display:flex;align-items:center;justify-content:center;
  color:#fff; font-weight:700; font-size:15px; flex-shrink:0; position:relative;
  font-family:'Space Grotesk',sans-serif;
}
.chat-meta{flex:1; min-width:0;}
.chat-meta-top{display:flex; justify-content:space-between; align-items:center; gap:6px;}
.chat-name{font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.chat-time{font-size:10.5px; color:var(--muted); flex-shrink:0;}
.chat-preview{font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px;}
.unread-badge{
  background:var(--grad); color:#fff; font-size:10.5px; font-weight:700; border-radius:20px;
  min-width:18px; height:18px; display:flex; align-items:center; justify-content:center; padding:0 5px;
}
.pin-icn{font-size:10px; color:var(--muted); margin-left:3px;}

/* center chat */
.chat-main{display:flex; flex-direction:column; background:var(--void); position:relative; min-width:0;}
.empty-state{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--muted); gap:10px;}
.empty-state .em-icn{font-size:40px; opacity:.5;}
.chat-header{
  display:flex; align-items:center; gap:12px; padding:14px 20px; border-bottom:1px solid var(--border);
  background:rgba(19,19,31,0.5); backdrop-filter:blur(10px);
}
.chat-header .chat-avatar{width:38px;height:38px; border-radius:11px; font-size:13px;}
.chat-header-info{flex:1; min-width:0;}
.chat-header-name{font-size:14.5px; font-weight:600;}
.chat-header-sub{font-size:11.5px; color:var(--muted);}
.header-actions{display:flex; gap:6px;}
.icn-btn{
  width:36px;height:36px; border-radius:10px; border:none; background:transparent; color:var(--muted);
  cursor:pointer; font-size:16px; display:flex; align-items:center; justify-content:center;
  transition:background .15s, color .15s;
}
.icn-btn:hover{background:var(--surface-2); color:var(--text);}
.pinned-banner{
  padding:8px 20px; background:rgba(124,111,242,0.08); border-bottom:1px solid var(--border);
  font-size:12px; color:var(--text); display:flex; align-items:center; gap:8px; cursor:pointer;
}
.pinned-banner b{color:var(--violet);}

.messages-wrap{flex:1; overflow-y:auto; padding:18px 20px; display:flex; flex-direction:column; gap:3px;}
.date-sep{
  align-self:center; font-size:11px; color:var(--muted); background:var(--surface); padding:4px 12px;
  border-radius:20px; margin:14px 0; border:1px solid var(--border);
}
.msg-row{display:flex; gap:8px; max-width:68%; position:relative; margin-bottom:8px;}
.msg-row.own{align-self:flex-end; flex-direction:row-reverse;}
.msg-row .mini-avatar{
  width:26px;height:26px;border-radius:8px; font-size:10px; display:flex;align-items:center;justify-content:center;
  color:#fff; font-weight:700; flex-shrink:0; align-self:flex-end; font-family:'Space Grotesk',sans-serif;
}
.msg-bubble-col{display:flex; flex-direction:column; min-width:0;}
.sender-label{font-size:11px; color:var(--violet); margin-bottom:2px; font-weight:600;}
.bubble{
  padding:9px 13px; border-radius:16px; font-size:13.8px; line-height:1.6; position:relative;
  background:var(--surface-2); border:1px solid var(--border);
  word-wrap:break-word; white-space:pre-wrap;
  animation:bubbleIn .25s ease;
}
@keyframes bubbleIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
.msg-row.own .bubble{background:var(--grad); color:#fff; border:none;}
.bubble.deleted{opacity:.55; font-style:italic;}
.reply-preview-inline{
  border-right:2px solid var(--cyan); padding-right:8px; margin-bottom:5px; font-size:11.5px; color:var(--muted);
  opacity:.85;
}
.msg-row.own .reply-preview-inline{border-right-color:rgba(255,255,255,0.6); color:rgba(255,255,255,0.75);}
.bubble-foot{display:flex; align-items:center; gap:5px; margin-top:4px; font-size:10px; opacity:.7;}
.msg-reactions{display:flex; gap:3px; margin-top:5px; flex-wrap:wrap;}
.reaction-chip{
  background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:1px 7px; font-size:11px;
  display:flex; align-items:center; gap:3px; cursor:pointer;
}
.reaction-chip.mine{border-color:var(--violet);}
.msg-hover-actions{
  position:absolute; top:-16px; display:none; gap:2px; background:var(--surface); border:1px solid var(--border);
  border-radius:10px; padding:3px; box-shadow:0 6px 16px rgba(0,0,0,0.3);
}
.msg-row.own .msg-hover-actions{left:0;}
.msg-row:not(.own) .msg-hover-actions{right:0;}
.msg-row:hover .msg-hover-actions{display:flex;}
.mha-btn{
  width:26px;height:26px;border:none;background:none;border-radius:7px;cursor:pointer;font-size:13px;color:var(--muted);
  display:flex;align-items:center;justify-content:center;
}
.mha-btn:hover{background:var(--surface-2); color:var(--text);}
.emoji-pop{
  position:absolute; top:-46px; background:var(--surface); border:1px solid var(--border); border-radius:12px;
  padding:5px 6px; display:flex; gap:3px; box-shadow:0 8px 24px rgba(0,0,0,0.4); z-index:5;
}
.emoji-pop span{cursor:pointer; font-size:16px; padding:3px; transition:transform .1s;}
.emoji-pop span:hover{transform:scale(1.3);}

.typing-row{padding:0 20px 6px; font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; min-height:20px;}
.typing-dots{display:flex; gap:2px;}
.typing-dots span{width:5px;height:5px;border-radius:50%;background:var(--muted); animation:tdot 1s infinite;}
.typing-dots span:nth-child(2){animation-delay:.15s;} .typing-dots span:nth-child(3){animation-delay:.3s;}
@keyframes tdot{0%,60%,100%{opacity:.3;} 30%{opacity:1;}}

.composer-wrap{padding:14px 20px 18px;}
.reply-banner{
  display:flex; align-items:center; justify-content:space-between; background:var(--surface-2); border:1px solid var(--border);
  border-radius:12px 12px 0 0; padding:8px 12px; font-size:12px; border-bottom:none;
}
.reply-banner b{color:var(--cyan);}
.composer{
  display:flex; align-items:flex-end; gap:8px; background:var(--surface-2); border:1px solid var(--border);
  border-radius:16px; padding:8px 10px;
}
.composer textarea{
  flex:1; background:none; border:none; outline:none; color:var(--text); font-size:14px; resize:none;
  max-height:120px; font-family:inherit; line-height:1.5; padding:6px 4px;
}
.composer-btn{
  width:36px;height:36px;border-radius:10px;border:none;background:none;color:var(--muted);cursor:pointer;
  font-size:17px; display:flex;align-items:center;justify-content:center; flex-shrink:0;
}
.composer-btn:hover{background:var(--surface); color:var(--text);}
.send-btn{background:var(--grad); color:#fff;}
.send-btn:hover{opacity:.9; background:var(--grad);}
.send-btn:disabled{opacity:.4; cursor:default;}
.img-preview-strip{display:flex; gap:8px; margin-bottom:8px; flex-wrap:wrap;}
.img-preview-strip img{width:54px;height:54px;object-fit:cover;border-radius:10px; border:1px solid var(--border);}
.msg-img{max-width:240px; border-radius:12px; display:block; margin-top:4px; cursor:pointer;}

/* right panel */
.panel{background:var(--surface); border-right:1px solid var(--border); overflow-y:auto; padding:20px 16px;}
.panel-section{margin-bottom:22px;}
.panel-section h3{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:10px; font-weight:600;}
.panel-avatar-big{
  width:76px;height:76px;border-radius:22px; margin:0 auto 12px; display:flex;align-items:center;justify-content:center;
  color:#fff; font-weight:700; font-size:26px; font-family:'Space Grotesk',sans-serif;
}
.panel-name{text-align:center; font-size:15.5px; font-weight:700; margin-bottom:2px;}
.panel-sub{text-align:center; font-size:12px; color:var(--muted); margin-bottom:18px;}
.member-row{display:flex; align-items:center; gap:8px; padding:6px 0; font-size:12.5px;}
.member-row .status-dot{position:static; border:none; width:7px;height:7px;}
.member-row .status-dot.off{background:var(--muted);}
.media-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:6px;}
.media-grid img{width:100%; aspect-ratio:1; object-fit:cover; border-radius:8px; cursor:pointer;}
.empty-mini{font-size:12px; color:var(--muted); text-align:center; padding:10px 0;}

/* modal */
.modal-overlay{
  position:fixed; inset:0; background:rgba(0,0,0,0.5); backdrop-filter:blur(4px); z-index:50;
  display:flex; align-items:center; justify-content:center; animation:fadeIn .2s ease;
}
@keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
.modal{
  width:380px; max-width:90vw; background:var(--surface); border:1px solid var(--border); border-radius:20px;
  padding:24px; max-height:80vh; overflow-y:auto; animation:cardIn .3s cubic-bezier(.16,1,.3,1);
}
.modal h2{font-family:'Space Grotesk',sans-serif; font-size:17px; margin-bottom:16px;}
.user-pick-row{
  display:flex; align-items:center; gap:10px; padding:9px 8px; border-radius:12px; cursor:pointer;
}
.user-pick-row:hover{background:var(--surface-2);}
.user-pick-row input{margin-right:auto;}
.modal-actions{display:flex; gap:8px; margin-top:16px;}
.btn-ghost{
  flex:1; padding:11px; border-radius:11px; border:1px solid var(--border); background:none; color:var(--text);
  cursor:pointer; font-size:13.5px; font-family:inherit;
}
.btn-ghost:hover{background:var(--surface-2);}

.toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--surface); border:1px solid var(--border);
  padding:11px 20px; border-radius:12px; font-size:13px; z-index:100; box-shadow:0 10px 30px rgba(0,0,0,0.4);
  animation:toastIn .3s ease;
}
@keyframes toastIn{from{opacity:0; transform:translate(-50%,10px);} to{opacity:1; transform:translate(-50%,0);}}

.mobile-back{display:none;}
@media(max-width:900px){
  .mobile-back{display:flex;}
  .shell{position:relative;}
  .rail,.sidebar{position:fixed; top:0; bottom:0; z-index:20; transition:transform .3s ease;}
  .rail{right:0; width:76px;}
  .sidebar{right:76px; width:280px; transform:translateX(100%);}
  .sidebar.mobile-open{transform:translateX(0);}
  .panel{position:fixed; left:0; top:0; bottom:0; width:280px; z-index:20;}
  .chat-main{width:100%;}
}
</style>
</head>
<body data-theme="dark">

<div class="aurora-bg"><span></span><span></span><span></span></div>

<!-- AUTH SCREEN -->

<script>
/* ================= STATE ================= */
let session = null; // {username, displayName, avatarColor}
let currentChatId = null;
let usersCache = {};
let chatsCache = {};
let messagesCache = {}; // chatId -> array
let presenceCache = {};
let readsCache = {}; // chatId -> {username: ts}
let replyTarget = null;
let editTarget = null;
let pendingImages = [];
let pollTimer = null;
let typingTimeout = null;
let panelOpen = false;
let isSignupMode = false;
let searchQuery = '';

const AVATAR_COLORS = ['#7c6ff2','#45d9e0','#e85fd6','#f2a154','#4ade80','#f25c5c','#5c9df2'];
function colorFor(name){
  let h=0; for(let i=0;i<name.length;i++) h = name.charCodeAt(i) + ((h<<5)-h);
  return AVATAR_COLORS[Math.abs(h) % AVATAR_COLORS.length];
}
function initials(name){ return (name||'?').trim().slice(0,2).toUpperCase(); }
function nowTs(){ return Date.now(); }
function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
function fmtTime(ts){
  const d = new Date(ts);
  return d.toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'});
}
function fmtDay(ts){
  const d = new Date(ts);
  const today = new Date();
  const isToday = d.toDateString() === today.toDateString();
  const yest = new Date(today); yest.setDate(yest.getDate()-1);
  if(isToday) return 'امروز';
  if(d.toDateString() === yest.toDateString()) return 'دیروز';
  return d.toLocaleDateString('fa-IR',{month:'long', day:'numeric'});
}
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function toast(msg){
  const el = document.createElement('div');
  el.className='toast'; el.textContent = msg;
  document.getElementById('toast-root').appendChild(el);
  setTimeout(()=>el.remove(), 2600);
}

/* ================= STORAGE HELPERS ================= */
async function sget(key, shared){
  try{
    const r = await window.storage.get(key, shared);
    return r ? JSON.parse(r.value) : null;
  }catch(e){ return null; }
}
async function sset(key, value, shared){
  try{ await window.storage.set(key, JSON.stringify(value), shared); }
  catch(e){ console.error('storage set failed', e); toast('ذخیره‌سازی ناموفق بود'); }
}

async function loadUsers(){ usersCache = await sget('users', true) || {}; return usersCache; }
async function saveUsers(){ await sset('users', usersCache, true); }
async function loadChats(){ chatsCache = await sget('chats', true) || {}; return chatsCache; }
async function saveChats(){ await sset('chats', chatsCache, true); }
async function loadMessages(chatId){
  const m = await sget('messages:'+chatId, true) || [];
  messagesCache[chatId] = m;
  return m;
}
async function saveMessages(chatId){ await sset('messages:'+chatId, messagesCache[chatId]||[], true); }
async function loadPresence(){ presenceCache = await sget('presence', true) || {}; return presenceCache; }
async function savePresence(){ await sset('presence', presenceCache, true); }
async function loadReads(chatId){
  readsCache[chatId] = await sget('reads:'+chatId, true) || {};
  return readsCache[chatId];
}
async function saveReads(chatId){ await sset('reads:'+chatId, readsCache[chatId]||{}, true); }

/* ================= AUTH ================= */
const authForm = document.getElementById('auth-form');
const authTitle = document.getElementById('auth-title');
const authSub = document.getElementById('auth-sub');
const authSubmit = document.getElementById('auth-submit');
const switchLink = document.getElementById('switch-link');
const authSwitch = document.getElementById('auth-switch');
const displaynameField = document.getElementById('displayname-field');
const rememberRow = document.getElementById('remember-row');
const authErrorBox = document.getElementById('auth-error');

document.getElementById('toggle-pass').addEventListener('click', ()=>{
  const inp = document.getElementById('in-password');
  const btn = document.getElementById('toggle-pass');
  if(inp.type==='password'){ inp.type='text'; btn.textContent='مخفی'; } else { inp.type='password'; btn.textContent='نمایش'; }
});

function setAuthMode(signup){
  isSignupMode = signup;
  authErrorBox.innerHTML='';
  if(signup){
    authTitle.textContent='بساز حساب جدید';
    authSub.textContent='یک نام کاربری و رمز انتخاب کن';
    displaynameField.style.display='block';
    rememberRow.style.display='none';
    authSubmit.textContent='ساخت حساب';
    authSwitch.innerHTML = 'قبلاً حساب داری؟ <a id="switch-link">وارد شو</a>';
  }else{
    authTitle.textContent='خوش برگشتی';
    authSub.textContent="وارد What's Yakarim شو و به دوستات وصل شو";
    displaynameField.style.display='none';
    rememberRow.style.display='flex';
    authSubmit.textContent='ورود';
    authSwitch.innerHTML = 'حساب نداری؟ <a id="switch-link">بساز</a>';
  }
  document.getElementById('switch-link').addEventListener('click', ()=> setAuthMode(!isSignupMode));
}
switchLink.addEventListener('click', ()=> setAuthMode(!isSignupMode));

authForm.addEventListener('submit', async (e)=>{
  e.preventDefault();
  authErrorBox.innerHTML='';
  const username = document.getElementById('in-username').value.trim().toLowerCase();
  const password = document.getElementById('in-password').value;
  const displayName = document.getElementById('in-displayname').value.trim();

  if(!username || !password){
    showAuthError('نام کاربری و رمز رو وارد کن');
    return;
  }
  if(!/^[a-z0-9_]{3,20}$/.test(username)){
    showAuthError('نام کاربری فقط حروف انگلیسی، عدد و _ باشه (۳ تا ۲۰ کاراکتر)');
    return;
  }

  authSubmit.disabled = true;
  authSubmit.innerHTML = (isSignupMode?'در حال ساخت...':'در حال ورود...') + '<span class="spinner"></span>';

  await loadUsers();

  if(isSignupMode){
    if(usersCache[username]){
      showAuthError('این نام کاربری قبلاً گرفته شده');
      resetSubmitBtn(); return;
    }
    if(password.length < 4){
      showAuthError('رمز باید حداقل ۴ کاراکتر باشه');
      resetSubmitBtn(); return;
    }
    usersCache[username] = {
      password, displayName: displayName || username, avatarColor: colorFor(username),
      bio:'', createdAt: nowTs()
    };
    await saveUsers();
    session = {username, displayName: usersCache[username].displayName, avatarColor: usersCache[username].avatarColor};
    enterApp();
  }else{
    const u = usersCache[username];
    if(!u || u.password !== password){
      showAuthError('نام کاربری یا رمز اشتباهه');
      resetSubmitBtn(); return;
    }
    session = {username, displayName:u.displayName, avatarColor:u.avatarColor};
    enterApp();
  }
});
function resetSubmitBtn(){
  authSubmit.disabled = false;
  authSubmit.textContent = isSignupMode? 'ساخت حساب':'ورود';
}
function showAuthError(msg){
  authErrorBox.innerHTML = '<div class="error-msg">'+escapeHtml(msg)+'</div>';
  resetSubmitBtn();
}

/* ================= ENTER APP ================= */
async function enterApp(){
  document.getElementById('auth-screen').style.display='none';
  document.getElementById('app-screen').style.display='block';
  document.getElementById('my-avatar').style.background = session.avatarColor;
  document.getElementById('my-avatar').innerHTML = initials(session.displayName) + '<div class="status-dot"></div>';

  await loadPresence();
  presenceCache[session.username] = {online:true, lastSeen: nowTs(), typingIn:null};
  await savePresence();

  await refreshAll();
  renderChatList();

  pollTimer = setInterval(async ()=>{
    await loadPresence();
    presenceCache[session.username] = presenceCache[session.username] || {};
    presenceCache[session.username].online = true;
    presenceCache[session.username].lastSeen = nowTs();
    await savePresence();
    await refreshAll();
    renderChatList();
    if(currentChatId) renderChatMain();
  }, 3000);

  window.addEventListener('beforeunload', async ()=>{
    if(presenceCache[session.username]){ presenceCache[session.username].online=false; }
    await savePresence();
  });
}
async function refreshAll(){
  await loadUsers();
  await loadChats();
  await loadPresence();
  const myChats = Object.entries(chatsCache).filter(([id,c])=>c.members.includes(session.username));
  for(const [id] of myChats){
    await loadMessages(id);
  }
}

/* ================= CHAT LIST ================= */
function myChatsList(){
  return Object.entries(chatsCache)
    .filter(([id,c])=>c.members.includes(session.username))
    .map(([id,c])=>({id, ...c}))
    .filter(c=>{
      if(!searchQuery) return true;
      return chatDisplayName(c).toLowerCase().includes(searchQuery.toLowerCase());
    })
    .sort((a,b)=>{
      const pa = a.pinned?1:0, pb=b.pinned?1:0;
      if(pa!==pb) return pb-pa;
      const la = lastMsg(a.id)?.ts || a.createdAt;
      const lb = lastMsg(b.id)?.ts || b.createdAt;
      return lb-la;
    });
}
function lastMsg(chatId){
  const arr = messagesCache[chatId]||[];
  return arr.length? arr[arr.length-1] : null;
}
function chatDisplayName(chat){
  if(chat.type==='group') return chat.name;
  const other = chat.members.find(m=>m!==session.username);
  return usersCache[other]?.displayName || other || 'کاربر حذف‌شده';
}
function chatAvatarColor(chat){
  if(chat.type==='group') return chat.avatarColor;
  const other = chat.members.find(m=>m!==session.username);
  return usersCache[other]?.avatarColor || '#7c6ff2';
}
function unreadCount(chatId){
  const arr = messagesCache[chatId]||[];
  const myLastRead = (readsCache[chatId]||{})[session.username] || 0;
  return arr.filter(m=>m.ts>myLastRead && m.sender!==session.username && !m.deleted).length;
}

function renderChatList(){
  const list = document.getElementById('chat-list');
  const chats = myChatsList();
  if(chats.length===0){
    list.innerHTML = '<div class="empty-mini" style="padding:30px 10px;">هنوز چتی نداری. یک چت خصوصی یا گروه جدید بساز.</div>';
    return;
  }
  list.innerHTML = chats.map(c=>{
    const name = chatDisplayName(c);
    const color = chatAvatarColor(c);
    const lm = lastMsg(c.id);
    const preview = lm ? (lm.deleted? 'پیام حذف شد' : (lm.imageData? '📷 عکس' : lm.text)) : 'هنوز پیامی نیست';
    const unread = unreadCount(c.id);
    const other = c.type==='dm' ? c.members.find(m=>m!==session.username) : null;
    const online = other && presenceCache[other]?.online;
    return `<div class="chat-item ${c.id===currentChatId?'active':''}" data-id="${c.id}">
      <div class="chat-avatar" style="background:${color}">${c.type==='group'?'👥':initials(name)}
        ${online?'<div class="status-dot" style="width:9px;height:9px;bottom:-1px;left:-1px;"></div>':''}
      </div>
      <div class="chat-meta">
        <div class="chat-meta-top">
          <span class="chat-name">${c.pinned?'<span class="pin-icn">📌</span>':''}${escapeHtml(name)}</span>
          <span class="chat-time">${lm?fmtTime(lm.ts):''}</span>
        </div>
        <div class="chat-meta-top">
          <span class="chat-preview">${escapeHtml(preview||'')}</span>
          ${unread>0?`<span class="unread-badge">${unread}</span>`:''}
        </div>
      </div>
    </div>`;
  }).join('');
  list.querySelectorAll('.chat-item').forEach(el=>{
    el.addEventListener('click', ()=> openChat(el.dataset.id));
  });
}

document.getElementById('search-input').addEventListener('input', (e)=>{
  searchQuery = e.target.value;
  renderChatList();
});

/* ================= OPEN / RENDER CHAT ================= */
async function openChat(chatId){
  currentChatId = chatId;
  replyTarget = null; editTarget = null; pendingImages = [];
  await loadMessages(chatId);
  await loadReads(chatId);
  readsCache[chatId][session.username] = nowTs();
  await saveReads(chatId);
  renderChatList();
  renderChatMain();
}

function otherMembers(chat){
  return chat.members.filter(m=>m!==session.username);
}

function renderChatMain(){
  const chat = chatsCache[currentChatId];
  const main = document.getElementById('chat-main');
  if(!chat){ main.innerHTML = '<div class="empty-state"><div class="em-icn">✨</div><div>یک چت رو انتخاب کن</div></div>'; return; }
  const name = chatDisplayName(chat);
  const color = chatAvatarColor(chat);
  const others = otherMembers(chat);
  let subtitle = '';
  if(chat.type==='dm'){
    const o = others[0];
    const p = presenceCache[o];
    subtitle = p?.online ? 'آنلاین' : (p?.lastSeen ? 'بازدید آخر: '+fmtTime(p.lastSeen) : 'آفلاین');
  }else{
    const onlineCount = others.filter(m=>presenceCache[m]?.online).length + 1;
    subtitle = chat.members.length + ' عضو · ' + onlineCount + ' آنلاین';
  }

  const msgs = messagesCache[currentChatId]||[];
  const pinnedMsg = msgs.find(m=>m.id===chat.pinnedMessageId);

  main.innerHTML = `
    <div class="chat-header">
      <div class="chat-avatar" style="background:${color}">${chat.type==='group'?'👥':initials(name)}</div>
      <div class="chat-header-info">
        <div class="chat-header-name">${escapeHtml(name)}</div>
        <div class="chat-header-sub">${escapeHtml(subtitle)}</div>
      </div>
      <div class="header-actions">
        <button class="icn-btn" id="btn-toggle-panel">ℹ️</button>
      </div>
    </div>
    ${pinnedMsg? `<div class="pinned-banner" id="pinned-banner-el">📌 پین‌شده: <b>${escapeHtml(pinnedMsg.deleted?'پیام حذف شد':(pinnedMsg.text||'عکس'))}</b></div>` : ''}
    <div class="messages-wrap" id="messages-wrap"></div>
    <div class="typing-row" id="typing-row"></div>
    <div class="composer-wrap">
      <div id="reply-banner-slot"></div>
      <div id="img-preview-slot"></div>
      <div class="composer">
        <button class="composer-btn" id="btn-attach">📎</button>
        <textarea id="composer-input" placeholder="پیامت رو بنویس..." rows="1"></textarea>
        <button class="composer-btn" id="btn-emoji">😊</button>
        <button class="composer-btn send-btn" id="btn-send">➤</button>
      </div>
      <input type="file" id="file-input" accept="image/*" multiple style="display:none" />
    </div>
  `;
  renderMessages();
  renderTyping();
  renderReplyBanner();
  renderImgPreview();

  document.getElementById('btn-toggle-panel').addEventListener('click', togglePanel);
  const bannerEl = document.getElementById('pinned-banner-el');
  if(bannerEl) bannerEl.addEventListener('click', ()=>{
    const el = document.querySelector(`[data-msg-id="${chat.pinnedMessageId}"]`);
    if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
  });

  const input = document.getElementById('composer-input');
  const sendBtn = document.getElementById('btn-send');
  input.addEventListener('input', ()=>{
    input.style.height='auto'; input.style.height = Math.min(input.scrollHeight,120)+'px';
    sendBtn.disabled = !input.value.trim() && pendingImages.length===0;
    onTyping();
  });
  input.addEventListener('keydown', (e)=>{
    if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); }
  });
  sendBtn.disabled = true;
  sendBtn.addEventListener('click', sendMessage);
  document.getElementById('btn-attach').addEventListener('click', ()=> document.getElementById('file-input').click());
  document.getElementById('file-input').addEventListener('change', handleFileSelect);
  document.getElementById('btn-emoji').addEventListener('click', (e)=> openEmojiPicker(e, null));

  if(panelOpen) renderPanel(); else document.getElementById('shell').classList.remove('with-panel');
  const wrap = document.getElementById('messages-wrap');
  wrap.scrollTop = wrap.scrollHeight;
}

function togglePanel(){
  panelOpen = !panelOpen;
  const shell = document.getElementById('shell');
  if(panelOpen){ shell.classList.add('with-panel'); renderPanel(); }
  else{ shell.classList.remove('with-panel'); const p=document.getElementById('right-panel'); if(p) p.remove(); }
}

function renderPanel(){
  const chat = chatsCache[currentChatId];
  if(!chat) return;
  let old = document.getElementById('right-panel');
  if(old) old.remove();
  const panel = document.createElement('div');
  panel.className='panel'; panel.id='right-panel';
  const name = chatDisplayName(chat);
  const color = chatAvatarColor(chat);
  const msgs = messagesCache[currentChatId]||[];
  const media = msgs.filter(m=>m.imageData && !m.deleted);

  let membersHtml = '';
  if(chat.type==='group'){
    membersHtml = chat.members.map(m=>{
      const u = usersCache[m];
      const online = presenceCache[m]?.online;
      return `<div class="member-row">
        <div class="chat-avatar" style="width:28px;height:28px;border-radius:9px;font-size:11px;background:${u?.avatarColor||'#888'}">${initials(u?.displayName||m)}</div>
        <span>${escapeHtml(u?.displayName||m)} ${m===session.username?'(تو)':''}</span>
        <span class="status-dot ${online?'':'off'}" style="margin-right:auto;"></span>
      </div>`;
    }).join('');
  }else{
    const other = otherMembers(chat)[0];
    const u = usersCache[other];
    membersHtml = `<div style="font-size:12.5px; color:var(--muted); text-align:center;">${escapeHtml(u?.bio || 'بدون بیو')}</div>`;
  }

  panel.innerHTML = `
    <div class="panel-avatar-big" style="background:${color}">${chat.type==='group'?'👥':initials(name)}</div>
    <div class="panel-name">${escapeHtml(name)}</div>
    <div class="panel-sub">${chat.type==='group'? chat.members.length+' عضو' : '@'+otherMembers(chat)[0]}</div>
    <div class="panel-section">
      <h3>${chat.type==='group'?'اعضا':'درباره'}</h3>
      ${membersHtml}
    </div>
    <div class="panel-section">
      <h3>مدیا (${media.length})</h3>
      ${media.length? `<div class="media-grid">${media.slice(-9).reverse().map(m=>`<img src="${m.imageData}" />`).join('')}</div>` : '<div class="empty-mini">هنوز مدیایی نیست</div>'}
    </div>
  `;
  document.getElementById('shell').appendChild(panel);
}

/* ================= MESSAGES RENDER ================= */
function renderMessages(){
  const wrap = document.getElementById('messages-wrap');
  const msgs = messagesCache[currentChatId]||[];
  const chat = chatsCache[currentChatId];
  const myReads = readsCache[currentChatId]||{};
  let html = '';
  let lastDay = null;
  msgs.forEach((m, idx)=>{
    const day = fmtDay(m.ts);
    if(day !== lastDay){ html += `<div class="date-sep">${day}</div>`; lastDay = day; }
    const isOwn = m.sender === session.username;
    const sender = usersCache[m.sender];
    const showSenderLabel = chat.type==='group' && !isOwn;
    let seenLabel = '';
    if(isOwn && idx === msgs.length-1){
      const others = chat.members.filter(x=>x!==session.username);
      const seenByAll = others.every(o => (readsCache[currentChatId]||{})[o] >= m.ts);
      seenLabel = seenByAll ? 'دیده شد ✓✓' : 'ارسال شد ✓';
    }
    const reactions = m.reactions || {};
    const reactionEntries = Object.entries(reactions).filter(([e,users])=>users.length>0);

    html += `<div class="msg-row ${isOwn?'own':''}" data-msg-id="${m.id}">
      ${!isOwn? `<div class="mini-avatar" style="background:${sender?.avatarColor||'#888'}">${initials(sender?.displayName||m.sender)}</div>` : ''}
      <div class="msg-bubble-col">
        ${showSenderLabel? `<div class="sender-label">${escapeHtml(sender?.displayName||m.sender)}</div>` : ''}
        <div class="bubble ${m.deleted?'deleted':''}">
          ${m.replyTo ? renderReplyPreview(m.replyTo) : ''}
          ${m.deleted ? 'این پیام حذف شد' : (m.imageData ? `<img class="msg-img" src="${m.imageData}" onclick="window.open('${m.imageData}','_blank')" />` : '') }
          ${(!m.deleted && m.text) ? escapeHtml(m.text) : ''}
          <div class="bubble-foot">
            <span>${fmtTime(m.ts)}</span>
            ${m.edited && !m.deleted ? '<span>· ویرایش‌شده</span>' : ''}
          </div>
        </div>
        ${reactionEntries.length? `<div class="msg-reactions">${reactionEntries.map(([e,users])=>`<span class="reaction-chip ${users.includes(session.username)?'mine':''}" data-emoji="${e}" data-msg="${m.id}">${e} ${users.length}</span>`).join('')}</div>` : ''}
        ${seenLabel? `<div style="font-size:10px; color:var(--muted); margin-top:2px; ${isOwn?'text-align:left;':''}">${seenLabel}</div>` : ''}
      </div>
      ${!m.deleted ? `<div class="msg-hover-actions">
        <button class="mha-btn" data-act="react" data-id="${m.id}" title="واکنش">😊</button>
        <button class="mha-btn" data-act="reply" data-id="${m.id}" title="پاسخ">↩️</button>
        ${isOwn && !m.imageData ? `<button class="mha-btn" data-act="edit" data-id="${m.id}" title="ویرایش">✏️</button>` : ''}
        <button class="mha-btn" data-act="pin" data-id="${m.id}" title="پین">📌</button>
        ${isOwn ? `<button class="mha-btn" data-act="delete" data-id="${m.id}" title="حذف">🗑️</button>` : ''}
      </div>` : ''}
    </div>`;
  });
  wrap.innerHTML = html || '<div class="empty-mini" style="margin:auto;">هنوز پیامی نیست، اولین نفر باش!</div>';

  wrap.querySelectorAll('.mha-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      const act = btn.dataset.act, id = btn.dataset.id;
      if(act==='react') openEmojiPicker(e, id);
      else if(act==='reply') setReply(id);
      else if(act==='edit') setEdit(id);
      else if(act==='pin') togglePin(id);
      else if(act==='delete') deleteMessage(id);
    });
  });
  wrap.querySelectorAll('.reaction-chip').forEach(chip=>{
    chip.addEventListener('click', ()=> toggleReaction(chip.dataset.msg, chip.dataset.emoji));
  });
}

function renderReplyPreview(replyToId){
  const msgs = messagesCache[currentChatId]||[];
  const target = msgs.find(m=>m.id===replyToId);
  if(!target) return '';
  const sender = usersCache[target.sender];
  return `<div class="reply-preview-inline"><b>${escapeHtml(sender?.displayName||target.sender)}</b>: ${escapeHtml(target.deleted?'پیام حذف شد':(target.text||'عکس'))}</div>`;
}

/* ================= EMOJI / REACTIONS ================= */
const EMOJIS = ['❤️','😂','👍','😮','😢','🔥'];
function openEmojiPicker(e, msgId){
  closeEmojiPicker();
  const pop = document.createElement('div');
  pop.className='emoji-pop'; pop.id='active-emoji-pop';
  pop.innerHTML = EMOJIS.map(em=>`<span data-e="${em}">${em}</span>`).join('');
  document.body.appendChild(pop);
  const rect = e.target.getBoundingClientRect();
  pop.style.top = (rect.top - 50) + 'px';
  pop.style.left = Math.max(8, rect.left - 60) + 'px';
  pop.querySelectorAll('span').forEach(s=>{
    s.addEventListener('click', ()=>{
      if(msgId) toggleReaction(msgId, s.dataset.e);
      else insertEmojiToComposer(s.dataset.e);
      closeEmojiPicker();
    });
  });
  setTimeout(()=> document.addEventListener('click', closeEmojiPickerOutside), 0);
}
function closeEmojiPickerOutside(e){
  const pop = document.getElementById('active-emoji-pop');
  if(pop && !pop.contains(e.target)){ closeEmojiPicker(); }
}
function closeEmojiPicker(){
  const pop = document.getElementById('active-emoji-pop');
  if(pop) pop.remove();
  document.removeEventListener('click', closeEmojiPickerOutside);
}
function insertEmojiToComposer(e){
  const input = document.getElementById('composer-input');
  if(input){ input.value += e; input.dispatchEvent(new Event('input')); input.focus(); }
}
async function toggleReaction(msgId, emoji){
  const msgs = messagesCache[currentChatId]||[];
  const m = msgs.find(x=>x.id===msgId);
  if(!m) return;
  m.reactions = m.reactions || {};
  m.reactions[emoji] = m.reactions[emoji] || [];
  const idx = m.reactions[emoji].indexOf(session.username);
  if(idx>=0) m.reactions[emoji].splice(idx,1); else m.reactions[emoji].push(session.username);
  await saveMessages(currentChatId);
  renderMessages();
}

/* ================= REPLY / EDIT / PIN / DELETE ================= */
function setReply(msgId){
  const msgs = messagesCache[currentChatId]||[];
  replyTarget = msgs.find(m=>m.id===msgId);
  editTarget = null;
  renderReplyBanner();
  document.getElementById('composer-input').focus();
}
function setEdit(msgId){
  const msgs = messagesCache[currentChatId]||[];
  editTarget = msgs.find(m=>m.id===msgId);
  replyTarget = null;
  if(editTarget){
    document.getElementById('composer-input').value = editTarget.text || '';
    document.getElementById('composer-input').dispatchEvent(new Event('input'));
  }
  renderReplyBanner();
  document.getElementById('composer-input').focus();
}
function renderReplyBanner(){
  const slot = document.getElementById('reply-banner-slot');
  if(!slot) return;
  if(replyTarget){
    const sender = usersCache[replyTarget.sender];
    slot.innerHTML = `<div class="reply-banner"><span>پاسخ به <b>${escapeHtml(sender?.displayName||replyTarget.sender)}</b>: ${escapeHtml((replyTarget.text||'عکس').slice(0,40))}</span><button class="icn-btn" id="cancel-reply">✕</button></div>`;
    document.getElementById('cancel-reply').addEventListener('click', ()=>{ replyTarget=null; renderReplyBanner(); });
  }else if(editTarget){
    slot.innerHTML = `<div class="reply-banner"><span>در حال ویرایش پیام</span><button class="icn-btn" id="cancel-edit">✕</button></div>`;
    document.getElementById('cancel-edit').addEventListener('click', ()=>{ editTarget=null; document.getElementById('composer-input').value=''; renderReplyBanner(); });
  }else{
    slot.innerHTML = '';
  }
}
async function togglePin(msgId){
  const chat = chatsCache[currentChatId];
  chat.pinnedMessageId = chat.pinnedMessageId===msgId? null : msgId;
  await saveChats();
  renderChatMain();
}
async function deleteMessage(msgId){
  const msgs = messagesCache[currentChatId]||[];
  const m = msgs.find(x=>x.id===msgId);
  if(!m) return;
  m.deleted = true; m.text=''; m.imageData=null;
  await saveMessages(currentChatId);
  renderMessages();
  renderChatList();
}

/* ================= TYPING ================= */
function onTyping(){
  presenceCache[session.username] = presenceCache[session.username] || {};
  presenceCache[session.username].typingIn = currentChatId;
  savePresence();
  clearTimeout(typingTimeout);
  typingTimeout = setTimeout(async ()=>{
    presenceCache[session.username].typingIn = null;
    await savePresence();
  }, 2500);
}
function renderTyping(){
  const row = document.getElementById('typing-row');
  if(!row) return;
  const chat = chatsCache[currentChatId];
  const typers = otherMembers(chat).filter(m => presenceCache[m]?.typingIn === currentChatId);
  if(typers.length){
    const names = typers.map(m=>usersCache[m]?.displayName||m).join('، ');
    row.innerHTML = `<span>${escapeHtml(names)} در حال تایپ است</span><div class="typing-dots"><span></span><span></span><span></span></div>`;
  }else{
    row.innerHTML='';
  }
}

/* ================= SEND MESSAGE ================= */
function handleFileSelect(e){
  const files = Array.from(e.target.files).slice(0,4);
  files.forEach(f=>{
    if(f.size > 3*1024*1024){ toast('عکس '+f.name+' خیلی بزرگه (حداکثر ۳ مگابایت)'); return; }
    const reader = new FileReader();
    reader.onload = ()=>{ pendingImages.push(reader.result); renderImgPreview(); };
    reader.readAsDataURL(f);
  });
  e.target.value = '';
}
function renderImgPreview(){
  const slot = document.getElementById('img-preview-slot');
  if(!slot) return;
  if(pendingImages.length===0){ slot.innerHTML=''; return; }
  slot.innerHTML = `<div class="img-preview-strip">${pendingImages.map((img,i)=>`<img src="${img}" data-i="${i}" />`).join('')}</div>`;
  const sendBtn = document.getElementById('btn-send');
  if(sendBtn) sendBtn.disabled = false;
}

async function sendMessage(){
  const input = document.getElementById('composer-input');
  const text = input.value.trim();
  if(!text && pendingImages.length===0) return;

  await loadMessages(currentChatId);

  if(editTarget){
    const m = messagesCache[currentChatId].find(x=>x.id===editTarget.id);
    if(m){ m.text = text; m.edited = true; }
    await saveMessages(currentChatId);
    editTarget = null;
  }else{
    if(pendingImages.length>0){
      pendingImages.forEach((img,i)=>{
        messagesCache[currentChatId].push({
          id: uid(), sender: session.username, text: i===0? text : '', imageData: img,
          ts: nowTs()+i, replyTo: i===0? (replyTarget?.id||null) : null, reactions:{}
        });
      });
    }else{
      messagesCache[currentChatId].push({
        id: uid(), sender: session.username, text, ts: nowTs(), replyTo: replyTarget?.id||null, reactions:{}
      });
    }
    await saveMessages(currentChatId);
    replyTarget = null;
    pendingImages = [];
  }

  input.value=''; input.style.height='auto';
  renderReplyBanner();
  renderImgPreview();
  renderMessages();
  renderChatList();
  const wrap = document.getElementById('messages-wrap');
  wrap.scrollTop = wrap.scrollHeight;

  readsCache[currentChatId] = readsCache[currentChatId]||{};
  readsCache[currentChatId][session.username] = nowTs();
  await saveReads(currentChatId);
}

/* ================= NEW DM / GROUP MODALS ================= */
document.getElementById('btn-new-dm').addEventListener('click', openNewDmModal);
document.getElementById('btn-new-group').addEventListener('click', openNewGroupModal);

async function openNewDmModal(){
  await loadUsers();
  const others = Object.keys(usersCache).filter(u=>u!==session.username);
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="modal-overlay" id="ov"><div class="modal">
    <h2>چت خصوصی جدید</h2>
    ${others.length===0? '<div class="empty-mini">هنوز دوستی ثبت‌نام نکرده. بهشون بگو با یک نام کاربری وارد Aurora بشن.</div>' :
      others.map(u=>`<div class="user-pick-row" data-u="${u}">
        <div class="chat-avatar" style="width:34px;height:34px;border-radius:10px;font-size:12px;background:${usersCache[u].avatarColor}">${initials(usersCache[u].displayName)}</div>
        <span>${escapeHtml(usersCache[u].displayName)}</span>
      </div>`).join('')}
    <div class="modal-actions"><button class="btn-ghost" id="close-modal">بستن</button></div>
  </div></div>`;
  document.getElementById('close-modal').addEventListener('click', closeModal);
  document.getElementById('ov').addEventListener('click', (e)=>{ if(e.target.id==='ov') closeModal(); });
  root.querySelectorAll('.user-pick-row').forEach(row=>{
    row.addEventListener('click', async ()=>{
      const other = row.dataset.u;
      await startDm(other);
      closeModal();
    });
  });
}
async function startDm(other){
  await loadChats();
  let existing = Object.entries(chatsCache).find(([id,c])=> c.type==='dm' && c.members.includes(session.username) && c.members.includes(other));
  let chatId;
  if(existing){ chatId = existing[0]; }
  else{
    chatId = uid();
    chatsCache[chatId] = {type:'dm', members:[session.username, other], createdAt: nowTs(), pinned:false, pinnedMessageId:null};
    await saveChats();
    messagesCache[chatId] = [];
    await saveMessages(chatId);
  }
  renderChatList();
  openChat(chatId);
}
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }

async function openNewGroupModal(){
  await loadUsers();
  const others = Object.keys(usersCache).filter(u=>u!==session.username);
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="modal-overlay" id="ov"><div class="modal">
    <h2>گروه جدید</h2>
    <div class="field"><label>نام گروه</label><input id="group-name-input" placeholder="مثلا: رفقای دانشگاه" /></div>
    <label style="font-size:12px;color:var(--muted);">اعضا رو انتخاب کن:</label>
    ${others.length===0? '<div class="empty-mini">هنوز کاربر دیگه‌ای نیست.</div>' :
      others.map(u=>`<div class="user-pick-row"><input type="checkbox" data-u="${u}" id="chk-${u}"/>
        <div class="chat-avatar" style="width:30px;height:30px;border-radius:9px;font-size:11px;background:${usersCache[u].avatarColor}">${initials(usersCache[u].displayName)}</div>
        <label for="chk-${u}">${escapeHtml(usersCache[u].displayName)}</label>
      </div>`).join('')}
    <div class="modal-actions">
      <button class="btn-ghost" id="close-modal">لغو</button>
      <button class="btn-primary" id="create-group-btn" style="flex:1;">ساخت گروه</button>
    </div>
  </div></div>`;
  document.getElementById('close-modal').addEventListener('click', closeModal);
  document.getElementById('ov').addEventListener('click', (e)=>{ if(e.target.id==='ov') closeModal(); });
  document.getElementById('create-group-btn').addEventListener('click', async ()=>{
    const name = document.getElementById('group-name-input').value.trim();
    const checked = Array.from(root.querySelectorAll('input[type=checkbox]:checked')).map(c=>c.dataset.u);
    if(!name){ toast('اسم گروه رو وارد کن'); return; }
    if(checked.length===0){ toast('حداقل یک عضو انتخاب کن'); return; }
    await loadChats();
    const chatId = uid();
    chatsCache[chatId] = {type:'group', name, members:[session.username, ...checked], avatarColor: colorFor(name), createdAt: nowTs(), pinned:false, pinnedMessageId:null};
    await saveChats();
    messagesCache[chatId]=[];
    await saveMessages(chatId);
    closeModal();
    renderChatList();
    openChat(chatId);
  });
}

/* ================= THEME / SETTINGS / LOGOUT ================= */
document.getElementById('btn-theme').addEventListener('click', ()=>{
  const body = document.body;
  const isDark = body.getAttribute('data-theme')==='dark';
  body.setAttribute('data-theme', isDark?'light':'dark');
  document.getElementById('btn-theme').textContent = isDark? '☀️':'🌙';
});

document.getElementById('btn-settings').addEventListener('click', ()=>{
  const root = document.getElementById('modal-root');
  const u = usersCache[session.username] || {};
  root.innerHTML = `<div class="modal-overlay" id="ov"><div class="modal">
    <h2>پروفایل من</h2>
    <div class="field"><label>نام نمایشی</label><input id="edit-dispname" value="${escapeHtml(u.displayName||'')}" /></div>
    <div class="field"><label>بیو</label><input id="edit-bio" value="${escapeHtml(u.bio||'')}" placeholder="یه چیزی درباره خودت بنویس" /></div>
    <div class="modal-actions">
      <button class="btn-ghost" id="close-modal">بستن</button>
      <button class="btn-primary" id="save-profile-btn" style="flex:1;">ذخیره</button>
    </div>
  </div></div>`;
  document.getElementById('close-modal').addEventListener('click', closeModal);
  document.getElementById('ov').addEventListener('click', (e)=>{ if(e.target.id==='ov') closeModal(); });
  document.getElementById('save-profile-btn').addEventListener('click', async ()=>{
    await loadUsers();
    usersCache[session.username].displayName = document.getElementById('edit-dispname').value.trim() || session.username;
    usersCache[session.username].bio = document.getElementById('edit-bio').value.trim();
    await saveUsers();
    session.displayName = usersCache[session.username].displayName;
    document.getElementById('my-avatar').innerHTML = initials(session.displayName) + '<div class="status-dot"></div>';
    renderChatList();
    if(currentChatId) renderChatMain();
    closeModal();
    toast('پروفایل ذخیره شد');
  });
});

document.getElementById('btn-logout').addEventListener('click', async ()=>{
  if(presenceCache[session.username]) presenceCache[session.username].online=false;
  await savePresence();
  clearInterval(pollTimer);
  session = null; currentChatId = null;
  document.getElementById('app-screen').style.display='none';
  document.getElementById('auth-screen').style.display='flex';
  document.getElementById('in-username').value='';
  document.getElementById('in-password').value='';
});
